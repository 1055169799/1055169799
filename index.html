<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay Chou · Music</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(160deg, #0f0f1a 0%, #16162a 45%, #1d1d33 100%);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    align-items: safe center; justify-content: safe center;
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8e8f0; padding: 24px 12px;
  }
  .wrap {
    display: flex; gap: 20px; align-items: stretch; justify-content: center;
    width: 100%; max-width: 940px; margin: 0 auto;
  }
  @media (max-width: 810px) {
    .wrap { flex-direction: column; align-items: center; }
    .wrap > .player, .wrap > .library { flex: 0 0 auto; width: min(470px, 94vw); align-self: center; }
  }

  /* ===== 播放器 ===== */
  .player {
    flex: 0 0 380px; width: 380px; max-width: 94vw; background: #16162a;
    border: 1px solid rgba(255,215,0,.62); border-radius: 24px; padding: 24px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,215,0,.12), 0 0 26px rgba(255,215,0,.07);
    display: flex; flex-direction: column;
    align-self: flex-start;
  }
  .cover {
    background: linear-gradient(135deg,#2a2a48 0%,#1a1a30 60%,#10101e 100%);
    border-radius: 18px; padding: 18px; text-align: center; margin-bottom: 18px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .cover::before {
    content: ''; position: absolute; inset: -40% -20%; z-index: 0;
    background: conic-gradient(from 0deg, rgba(255,215,0,.22), transparent 25%, rgba(255,215,0,.08) 50%, transparent 75%, rgba(255,215,0,.22));
    animation: spin 9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cover.paused::before { animation-play-state: paused; }
  .cover-inner { position: relative; z-index: 1; width: 100%; }
  .cover-icon { font-size: 60px; color: #ffd700; line-height: 1; text-shadow: 0 0 30px rgba(255,215,0,.6); padding: 62px 0; }
  .cover-img {
    display: none; width: 100%; aspect-ratio: 1/1; border-radius: 14px; object-fit: cover;
    max-width: min(100%, calc(100vh - 500px)); margin: 0 auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .cover-title { margin-top: 14px; font-size: 20px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cover-artist { margin-top: 6px; font-size: 13px; color: #9a9ab0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .time { font-size: 11px; color: #8a8aa0; width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 5px; background: #2a2a48; border-radius: 3px; position: relative; cursor: pointer; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#ffd700,#ffb800); border-radius: 3px; }
  .bar-fill::after {
    content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; border-radius: 50%; background: #ffd700;
    box-shadow: 0 0 8px rgba(255,215,0,.7); opacity: 0; transition: opacity .2s;
  }
  .bar:hover .bar-fill::after { opacity: 1; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 14px; }
  .controls button { background: none; border: none; cursor: pointer; color: #c8c8e0; transition: color .2s, transform .1s;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .controls button svg { display: block; }
  .controls button:hover { color: #ffd700; }
  .controls button:active { transform: scale(.92); }
  .controls .main {
    width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg,#ffd700,#ffb800);
    color: #16162a; box-shadow: 0 6px 20px rgba(255,215,0,.35);
  }
  .controls .main { padding: 0; }
  .controls .main:hover { color: #10101e; }
  .controls button.on { color: #ffd700; }

  .vol-row { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; padding: 0 4px; }
  .vol-row .ico { font-size: 13px; color: #8a8aa0; }
  .vol-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: #2a2a48; outline: none; }
  .vol-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #ffd700; cursor: pointer;
  }

  .quality-line { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .quality-line .qlink { margin-left: auto; flex: none; white-space: nowrap; }
  .qlink {
    display: inline-flex; align-items: center; gap: 7px; background: #202038;
    border: 1px solid #2a2a48; border-radius: 999px; color: #c8c8e0;
    font-size: 12px; padding: 6px 16px; cursor: pointer; font-family: inherit; transition: all .18s;
  }
  .qlink:hover { border-color: #ffd700; color: #ffd700; }
  .qlink .badge {
    font-size: 10px; color: #ffd700; border: 1px solid #3a3520; border-radius: 999px;
    padding: 1px 7px; font-variant-numeric: tabular-nums;
  }

  .mode-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap;
    padding-top: 13px; border-top: 1px solid #23233c; }
  .quality-row { display: flex; gap: 7px; justify-content: flex-start; flex-wrap: wrap; flex: 1; min-width: 0; }
  .qbtn {
    background: #202038; border: 1px solid #2a2a48; border-radius: 15px; color: #a8a8c8;
    font-size: 12px; padding: 5px 13px; cursor: pointer; transition: all .2s; letter-spacing: .3px;
  }
  .qbtn:hover:not(.off) { border-color: #ffd700; color: #ffd700; }
  .qbtn.act { background: rgba(255,215,0,.12); border-color: #ffd700; color: #ffd700; font-weight: 600; }
  .qbtn.off { opacity: .28; cursor: not-allowed; }

  .footer { text-align: center; font-size: 11px; color: #5a5a70; margin-top: 0; line-height: 1.6; }
  .footer:not(:empty) { margin-top: 12px; }

  /* ===== 曲库 ===== */
  .library {
    flex: 1 1 auto; width: 470px; min-width: 0; max-width: 94vw; background: #16162a;
    border: 1px solid rgba(255,215,0,.62);
    border-radius: 24px; padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,215,0,.12), 0 0 26px rgba(255,215,0,.07);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .lib-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .lib-head h2 { font-size: 15px; font-weight: 700; color: #ffd700; letter-spacing: 1px; }
  .lib-count { font-size: 12px; color: #8a8aa0; }

  .tabs { display: flex; gap: 7px; margin-bottom: 12px; }
  .tab {
    flex: 1; text-align: center; background: #202038; border: 1px solid #2a2a48; border-radius: 10px;
    color: #a8a8c8; font-size: 12px; padding: 8px 0; cursor: pointer; transition: all .2s;
    white-space: nowrap;
  }
  .tab:hover { border-color: #3a3a58; }
  .tab.act { color: #ffd700; border-color: #ffd700; background: rgba(255,215,0,.1); font-weight: 600; }

  .search-box {
    width: 100%; background: #202038; border: 1px solid #2a2a48; border-radius: 10px;
    color: #e8e8f0; font-size: 13px; padding: 9px 14px; outline: none; margin-bottom: 12px;
  }
  .search-box:focus { border-color: #ffd700; }
  .search-box::placeholder { color: #6a6a80; }

  .net-wrap {
    display: none; align-items: center; gap: 8px; height: 38px; margin-bottom: 12px;
    background: #202038; border: 1px solid #2a2a48; border-radius: 10px; padding: 0 12px;
    transition: border-color .18s;
  }
  .net-wrap:focus-within { border-color: #ffd700; }
  .net-wrap input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: #e8e8f0; font-size: 13px; font-family: inherit;
  }
  .net-wrap input::placeholder { color: #6a6a80; }
  .net-wrap .clr {
    display: none; background: none; border: none; color: #6a6a80; font-size: 11px;
    cursor: pointer; padding: 2px 4px; line-height: 1;
  }
  .net-wrap .clr.show { display: block; }
  .net-wrap .clr:hover { color: #ffd700; }

  .hot-row { display: none; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .chip {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px;
    color: #c8c8e0; font-size: 11.5px; padding: 5px 12px; cursor: pointer; user-select: none;
    transition: all .18s;
  }
  .chip:hover { border-color: #ffd700; color: #ffd700; }

  .hero { color: #8a8aa0; font-size: 12.5px; line-height: 1.9; padding: 6px 4px; }
  .hero b { color: #ffd700; font-weight: 600; }

  .scroll-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 4px; }
  @media (max-width: 810px) {
    .scroll-area { flex: 0 0 auto; max-height: 452px; }
  }
  .scroll-area::-webkit-scrollbar { width: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #2a2a48; border-radius: 3px; }

  .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 480px) { .album-grid { grid-template-columns: repeat(2, 1fr); } }
  .album-card { cursor: pointer; border-radius: 12px; overflow: hidden; background: #1b1b30;
    border: 1px solid transparent; transition: all .2s; }
  .album-card:hover { border-color: #ffd700; transform: translateY(-2px); }
  .album-card .pic { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: #2a2a48; }
  .album-card .info { padding: 7px 8px 9px; }
  .album-card .aname { font-size: 12px; font-weight: 600; color: #f2f2f8; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .album-card .ayear { font-size: 10.5px; color: #7a7a92; margin-top: 3px; }

  .playlist { list-style: none; }
  .playlist li { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 10px;
    cursor: pointer; transition: background .2s; }
  .playlist li:hover { background: #202038; }
  .playlist li.active { background: #24244a; }
  .playlist .num { width: 26px; flex-shrink: 0; font-size: 11.5px; color: #7a7a92; text-align: center; font-variant-numeric: tabular-nums; }
  .playlist li.active .num { color: #ffd700; font-weight: 700; }
  .playlist .meta { flex: 1; min-width: 0; }
  .playlist .tname { font-size: 13.5px; font-weight: 600; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist li.active .tname { color: #ffd700; }
  .playlist .tsub { font-size: 11px; color: #8a8aa0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist .dur { font-size: 11px; color: #7a7a92; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .addbtn {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid #2f2f4c;
    color: #8a8aa0; font-size: 12px; line-height: 1; display: flex; align-items: center;
    justify-content: center; transition: all .16s;
  }
  .addbtn:hover { border-color: #ffd700; color: #ffd700; }

  .more-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0 8px; }
  .more {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px; color: #c8c8e0;
    font-size: 12px; padding: 8px 22px; cursor: pointer; font-family: inherit; transition: all .18s;
  }
  .more:hover { border-color: #ffd700; color: #ffd700; }
  .more[disabled] { opacity: .55; cursor: default; }
  .more-tip { font-size: 11px; color: #6a6a82; font-variant-numeric: tabular-nums; }

  .back-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .back-btn { background: #202038; border: 1px solid #2a2a48; border-radius: 8px; color: #c8c8e0;
    font-size: 12px; padding: 5px 12px; cursor: pointer; font-family: inherit; }
  .back-btn:hover { border-color: #ffd700; color: #ffd700; }
  .alb-title { font-size: 12.5px; color: #9a9ac0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-tip, .loading { text-align: center; color: #6a6a80; font-size: 13px; padding: 26px 0; }
  .error-box { background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.35);
    border-radius: 12px; padding: 16px 14px; font-size: 12.5px; color: #ff9d9d; line-height: 1.7; }
  .error-box .retry { display: inline-block; margin-top: 10px; background: #202038; border: 1px solid #2a2a48;
    color: #ffd700; font-size: 12px; padding: 6px 16px; border-radius: 16px; cursor: pointer; }

  /* ===== 播放列表抽屉 ===== */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(6,6,14,.6);
    opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 60;
  }
  .drawer-mask.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 92vw);
    background: #151526; border-left: 1px solid #2a2a48;
    box-shadow: -18px 0 50px rgba(0,0,0,.55);
    transform: translateX(102%); transition: transform .26s cubic-bezier(.4,0,.2,1);
    z-index: 61; display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 18px 12px; border-bottom: 1px solid #23233c;
  }
  .drawer-head h3 { font-size: 14px; font-weight: 700; color: #ffd700; letter-spacing: .5px; }
  .drawer-head h3 span { font-size: 11px; color: #8a8aa0; font-weight: 400; margin-left: 6px; }
  .drawer-tools { display: flex; gap: 6px; }
  .drawer-tools button {
    background: #202038; border: 1px solid #2a2a48; color: #a8a8c8; font-size: 11.5px;
    padding: 4px 11px; border-radius: 14px; cursor: pointer; font-family: inherit; transition: all .16s;
  }
  .drawer-tools button:hover { border-color: #ffd700; color: #ffd700; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }
  .drawer-body::-webkit-scrollbar { width: 6px; }
  .drawer-body::-webkit-scrollbar-thumb { background: #2a2a48; border-radius: 3px; }
  .qlist { list-style: none; }
  .qlist li { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 9px; cursor: pointer; }
  .qlist li:hover { background: #1e1e34; }
  .qlist li.active { background: rgba(255,215,0,.1); }
  .qlist li.active .tname { color: #ffd700; }
  .qlist li.qempty { display: block; text-align: center; color: #6a6a82; font-size: 12px; padding: 30px 10px; cursor: default; line-height: 1.9; }
  .qlist li.qempty:hover { background: none; }
  .qlist .num { width: 22px; text-align: right; font-size: 11px; color: #5a5a72; flex: none; font-variant-numeric: tabular-nums; }
  .qlist .meta { flex: 1; min-width: 0; }
  .qlist .tname { font-size: 12.5px; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qlist .tsub { font-size: 10.5px; color: #7a7a92; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qlist .del {
    flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid #2f2f4c;
    color: #8a8aa0; font-size: 10px; display: flex; align-items: center; justify-content: center;
    transition: all .16s;
  }
  .qlist .del:hover { border-color: #ff6b6b; color: #ff6b6b; }

  .toast {
    position: fixed; left: 50%; bottom: 44px; transform: translate(-50%, 12px);
    background: rgba(28,28,46,.96); border: 1px solid #3a3a58; color: #e8e8f2;
    font-size: 12.5px; padding: 9px 18px; border-radius: 20px; opacity: 0;
    pointer-events: none; transition: all .22s; z-index: 80; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <div class="cover paused" id="cover">
      <div class="cover-inner">
        <img class="cover-img" id="coverImg" alt="cover">
        <div class="cover-icon" id="coverIcon">&#9835;</div>
        <div class="cover-title" id="coverTitle">让音乐回归纯粹</div>
        <div class="cover-artist" id="coverArtist"></div>
      </div>
    </div>

    <div class="progress-row">
      <span class="time" id="tCur">0:00</span>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <span class="time" id="tDur">0:00</span>
    </div>

    <div class="controls">
      <button id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.2 5.4h2.2v13.2H6.2zM17.8 5.4v13.2L9.4 12z"/></svg>
      </button>
      <button class="main" id="btnPlay" title="播放/暂停">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>
      </button>
      <button id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.6 5.4h2.2v13.2h-2.2zM6.2 5.4v13.2L14.6 12z"/></svg>
      </button>
    </div>

    <div class="vol-row">
      <span class="ico">&#128266;</span>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>

    <div class="mode-row" id="mRow"></div>
    <div class="quality-line">
      <div class="quality-row" id="qRow"></div>
      <button class="qlink" id="btnQueue">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="gold" d="M4 6h11v2H4zm0 5h11v2H4zm0 5h11v2H4z" /></svg>
        播放列表 <span class="badge" id="qBadge">0</span>
      </button>
    </div>
    <div class="footer" id="footer"></div>
  </div>

  <div class="library">
    <div class="lib-head">
      <h2 id="libTitle">专辑</h2>
      <span class="lib-count" id="libCount">--</span>
    </div>
    <div class="tabs">
      <div class="tab act" data-tab="album">周杰伦专辑</div>
      <div class="tab" data-tab="song">周杰伦歌曲</div>
      <div class="tab" data-tab="search">全站搜歌</div>
    </div>
    <input class="search-box" id="search" placeholder="搜索歌曲或专辑…" autocomplete="off">
    <div class="net-wrap" id="netWrap">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="color:#6a6a80;flex:none"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg>
      <input id="q" type="text" placeholder="搜索全网歌曲、歌手、专辑…" autocomplete="off">
      <button class="clr" id="clearQ" title="清空">&#10005;</button>
    </div>
    <div class="hot-row" id="hotRow"></div>
    <div class="scroll-area" id="view"><div class="loading">加载中…</div></div>
  </div>
</div>


<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>播放列表 <span id="qCount">0 首</span></h3>
    <div class="drawer-tools">
      <button id="clearQueue">清空</button>
      <button id="closeDrawer">关闭</button>
    </div>
  </div>
  <div class="drawer-body"><ul class="qlist" id="qlist"></ul></div>
</aside>

<div class="toast" id="toast"></div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  /* ================= 配置：周杰伦曲库（运行时拉取） ================= */
  var LIB = {
    artistAlbums: 'https://search.kuwo.cn/r.s?stype=albumlist&artistid=336&rn=100&encoding=utf8&rformat=json',
    albumSongs:   'https://search.kuwo.cn/r.s?stype=albuminfo&albumid={id}&vipver=1&encoding=utf8&rformat=json',
    cover:        'https://img1.kuwo.cn/star/albumcover/500/{pic}'
  };

  /* 酷我音源：a/b 为 haitangw 主备（首选），c 为酷我官方解析（兜底） */
  var SRC = {
    a: { url: 'https://music.haitangw.cc/music/kw.php' },
    b: { url: 'https://music.haitangw.cc/music/kw1.php' },
    c: { url: 'https://mobi.kuwo.cn/mobi.s?f=web&source=kwplayer_ar_5.1.0.0_B_jiakong_vh.apk&type=convert_url_with_sign&br=' }
  };

  /* 全网音源：聚合接口（仅在酷我搜不到 / 解析失败时兜底） */
  var MUSIC_API = 'https://music-api.gdstudio.xyz/api.php';
  var MUSIC_SOURCE = 'netease';

  /* 酷我全网搜索：官方 r.s 支持 JSONP，浏览器可直接跨域调用 */
  var KW_SEARCH = 'https://search.kuwo.cn/r.s';
  var KW_PAGE = 30;

  /* 三档音质统一口径；全网源按 999/320/128 映射 */
  var LEVELS = [
    { key: 'lossless', label: '无损', br: '999' },
    { key: 'exhigh',   label: '高品', br: '320' },
    { key: 'standard', label: '省流', br: '128' }
  ];

  var NET_PAGE = 30;
  var NET_TTL = 30 * 60 * 1000;
  var HOT = ['Beyond', '张学友', '林俊杰', '陈奕迅', '邓紫棋', '许嵩', '薛之谦', '李荣浩', '毛不易', '周深', '孙燕姿', 'Taylor Swift', 'Michael Jackson', 'BigBang'];
  var LAST_KEY = 'jay_v3_lastsearch';
  var SNAP_KEY = 'jay_core_v1';

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  /* ================= 播放核心（全局唯一，视图切换不影响） ================= */
  var Core = {
    queue: [],         // 播放队列（与视图列表 S.queue 完全分离）
    idx: -1,
    cur: null,
    quality: (function (q) {
      if (q === 'higher') return 'exhigh';
      return (q === 'lossless' || q === 'exhigh' || q === 'standard') ? q : 'exhigh';
    })(localStorage.getItem('jay_quality')),
    mode: (function (m) {
      return ['list', 'one', 'random', 'shuffle'].indexOf(m) >= 0 ? m : 'list';
    })(localStorage.getItem('jay_mode')),
    token: 0,
    urlCache: {},
    fallbackTried: false,
    resumeTime: 0
  };

  /* ================= 视图状态（仅渲染用，绝不承载播放态） ================= */
  var S = {
    albums: [],
    songs: {},          // albumId -> 歌曲数组
    queue: [],          // 当前视图列表
    tab: 'album',       // album | song | search
    curAlbum: null,
    loadingAlbum: {},
    allDone: false,
    watchPreload: false,
    net: { kw: '', list: [], pn: 0, loading: false, done: true, err: '', seq: 0 }
  };

  /* ================= 工具函数 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, ' ').trim();
  }
  function parseLoose(text) {
    try { return JSON.parse(text); } catch (e) {}
    try { return new Function('return (' + String(text).replace(/&nbsp;/g, ' ') + ')')(); } catch (e) {}
    return null;
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function ridOf(song) {
    if (!song) return '';
    return String(song.musicrid || song.rid || song.id || '').replace('MUSIC_', '');
  }
  function keyOf(song) {
    if (!song) return '';
    if (song.key) return song.key;
    if (song.src === 'net') return 'net:' + (song.id || song.url_id || '');
    return 'kw:' + ridOf(song);
  }
  function fixSong(s) {
    if (!s) return s;
    if (!s.src) s.src = s.rid ? 'kw' : 'net';
    if (!s.key) s.key = s.src === 'net' ? ('net:' + (s.id || s.url_id || '')) : ('kw:' + ridOf(s));
    return s;
  }
  function picUrl(pic) {
    if (!pic) return '';
    var p = String(pic).replace(/^http:\/\//i, 'https://');
    if (/^https:\/\//i.test(p)) return p.replace(/\/(120|150|300)\//, '/500/');
    p = p.replace(/^\/+/, '').replace(/^(120|150)\//, '');
    return LIB.cover.replace('{pic}', p);
  }
  function levelsOf(song) {
    if (!song || song.src === 'net') return { lossless: true, exhigh: true, standard: true };
    var f = String(song.formats || '').toUpperCase();
    /* 酷我搜索接口不返回 FORMATS，无法预判档位：先按请求档位取，解析端会逐档降级 */
    if (!f) return { lossless: true, exhigh: true, standard: true };
    var hasFlac = f.indexOf('FLAC') >= 0;
    var hasMp3 = f.indexOf('MP3H') >= 0 || f.indexOf('MP3128') >= 0;
    return { lossless: hasFlac, exhigh: hasMp3 || hasFlac, standard: true };
  }
  function pickLevel(song, want) {
    var ok = levelsOf(song);
    if (ok[want]) return want;
    var order = ['lossless', 'exhigh', 'standard'];
    for (var i = 0; i < order.length; i++) { if (ok[order[i]]) return order[i]; }
    return 'standard';
  }
  function labelOf(key) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === key) return LEVELS[i].label; }
    return '--';
  }

  /* ================= 缓存 ================= */
  var CACHE_PREFIX = 'jay_v2_';
  var CACHE_TTL = 24 * 60 * 60 * 1000;
  function cacheGet(k) {
    try {
      var raw = localStorage.getItem(CACHE_PREFIX + k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || Date.now() - o.t > CACHE_TTL) return null;
      return o.d;
    } catch (e) { return null; }
  }
  function cacheSet(k, d) {
    try { localStorage.setItem(CACHE_PREFIX + k, JSON.stringify({ t: Date.now(), d: d })); }
    catch (e) {}
  }
  function netCacheGet(k) {
    try {
      var raw = localStorage.getItem('jay_v3_' + k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || Date.now() - o.t > NET_TTL) return null;
      return o.d;
    } catch (e) { return null; }
  }
  function netCacheSet(k, d) {
    try { localStorage.setItem('jay_v3_' + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }

  /* ================= 周杰伦曲库加载 ================= */
  function fetchText(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }

  function fetchAlbums() {
    return fetchText(LIB.artistAlbums).then(function (t) {
      var d = parseLoose(t);
      var list = (d && (d.albumlist || d.albumList)) || [];
      S.albums = list.map(function (a) {
        return {
          id: String(a.albumid || a.albumId || a.id),
          name: clean(a.name || a.album || a.title),
          year: String(a.pub || a.releaseDate || '').slice(0, 4),
          cnt: Number(a.musiccnt || a.songcount || 0) || 0,
          pic: a.pic || a.img || ''
        };
      }).filter(function (a) { return a.id && a.id !== 'undefined'; });
      sortAlbums();
      cacheSet('albums', S.albums);
      return S.albums;
    });
  }

  function sortAlbums() {
    S.albums.sort(function (x, y) {
      var a = parseInt(x.year, 10), b = parseInt(y.year, 10);
      var va = isNaN(a) ? 9999 : a, vb = isNaN(b) ? 9999 : b;
      if (va !== vb) return va - vb;
      return String(x.name || '').localeCompare(String(y.name || ''), 'zh');
    });
  }

  function loadAlbums() {
    var cached = cacheGet('albums');
    if (cached && cached.length) {
      S.albums = cached;
      sortAlbums();
      renderAlbums();
      startPreload();
      fetchAlbums().then(function () {
        startPreload();
        if (S.tab === 'album' && !S.curAlbum) renderAlbums();
      }).catch(function () {});
      return;
    }
    if (S.tab === 'album') $('view').innerHTML = '<div class="loading">正在获取专辑列表…</div>';
    fetchAlbums().then(function () {
      renderAlbums();
      startPreload();
    }).catch(function (e) {
      if (S.tab !== 'album') return;
      $('view').innerHTML = '<div class="error-box">专辑列表加载失败：' + esc(e.message) +
        '<br><span class="retry" id="retryAlb">重试</span></div>';
      var b = $('retryAlb'); if (b) b.onclick = loadAlbums;
    });
  }

  function loadAlbumSongs(album) {
    if (S.songs[album.id]) return Promise.resolve(S.songs[album.id]);
    if (S.loadingAlbum[album.id]) return S.loadingAlbum[album.id];
    var cached = cacheGet('songs_' + album.id);
    if (cached && cached.length) {
      cached.forEach(fixSong);
      S.songs[album.id] = cached;
      return Promise.resolve(cached);
    }
    S.loadingAlbum[album.id] = fetchText(LIB.albumSongs.replace('{id}', album.id)).then(function (t) {
      var d = parseLoose(t) || {};
      var list = d.musiclist || d.musicList || [];
      var arr = list.map(function (m, i) {
        var rid = ridOf(m);
        return fixSong({
          src: 'kw',
          rid: rid,
          key: 'kw:' + rid,
          name: clean(m.name || m.songname),
          artist: clean(m.artist || '周杰伦'),
          album: clean(m.album || album.name),
          albumId: album.id,
          pic: m.pic120 || album.pic || '',
          duration: Number(m.duration || 0),
          formats: m.formats || '',
          no: i + 1
        });
      }).filter(function (s) { return s.rid; });
      S.songs[album.id] = arr;
      cacheSet('songs_' + album.id, arr);
      delete S.loadingAlbum[album.id];
      return arr;
    }).catch(function (e) {
      delete S.loadingAlbum[album.id];
      throw e;
    });
    return S.loadingAlbum[album.id];
  }

  /* ================= 渲染：专辑 / 曲目 / 全部歌曲 ================= */
  function renderAlbums(force) {
    if (!force && S.tab !== 'album') return;
    S.curAlbum = null;
    $('libTitle').textContent = '专辑';
    $('libCount').textContent = S.albums.length + ' 张';
    if (!S.albums.length) {
      $('view').innerHTML = '<div class="loading">正在获取专辑列表…</div>';
      return;
    }
    if (!Core.cur) showDefaultCover();
    else if ($('coverImg').getAttribute('data-rid') !== keyOf(Core.cur)) showSong(Core.cur);

    var kw = $('search').value.trim().toLowerCase();
    var list = S.albums.filter(function (a) { return !kw || a.name.toLowerCase().indexOf(kw) >= 0; });
    if (!list.length) { $('view').innerHTML = '<div class="empty-tip">没有匹配的专辑</div>'; return; }
    var html = '<div class="album-grid">';
    list.forEach(function (a) {
      var p = picUrl(a.pic);
      html += '<div class="album-card" data-i="' + S.albums.indexOf(a) + '">' +
        (p ? '<img class="pic" loading="lazy" src="' + p + '" onerror="this.style.visibility=\'hidden\'">' : '<div class="pic"></div>') +
        '<div class="info"><div class="aname">' + esc(a.name) + '</div>' +
        '<div class="ayear">' + (a.year || '') + (a.cnt ? ' · ' + a.cnt + ' 首' : '') + '</div></div></div>';
    });
    html += '</div>';
    $('view').innerHTML = html;
    var cards = $('view').querySelectorAll('.album-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].onclick = function () { openAlbum(+this.getAttribute('data-i')); };
    }
  }

  function openAlbum(i) {
    var album = S.albums[i];
    if (!album) return;
    S.curAlbum = album;
    $('view').innerHTML = '<div class="loading">正在加载《' + esc(album.name) + '》…</div>';
    loadAlbumSongs(album).then(function (arr) {
      S.queue = arr.slice();
      if (Core.mode === 'shuffle') shuffleQueue();
      renderSongsView(S.queue, album);
    }).catch(function (e) {
      $('view').innerHTML = '<div class="error-box">曲目加载失败：' + esc(e.message) +
        '<br><span class="retry" id="retryAlb2">重试</span></div>';
      var b = $('retryAlb2');
      if (b) b.onclick = function () { openAlbum(i); };
    });
  }

  function renderSongsView(arr, album) {
    $('libTitle').textContent = '曲目';
    $('libCount').textContent = arr.length + ' 首';
    var html = '<div class="back-row"><button class="back-btn" id="backToAlb">&#8592; 专辑</button>' +
      '<span class="alb-title">' + esc(album.name) + (album.year ? ' · ' + album.year : '') + '</span></div>';
    html += songListHtml(arr, false);
    $('view').innerHTML = html;
    var bb = $('backToAlb');
    if (bb) bb.onclick = function () { S.curAlbum = null; renderAlbums(true); };
    bindSongRows();
    markActive();
  }

  function songListHtml(arr, withAlbum) {
    var h = '<ul class="playlist">';
    arr.forEach(function (s, i) {
      var sub = withAlbum ? (s.album || s.artist || '') : (s.artist || '');
      h += '<li data-i="' + i + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="meta"><div class="tname">' + esc(s.name) + '</div>' +
        '<div class="tsub">' + esc(sub) + '</div></div>' +
        '<span class="dur">' + (s.duration ? fmtTime(s.duration) : '') + '</span>' +
        '<span class="addbtn" data-add="' + i + '" title="加入播放列表">&#65291;</span></li>';
    });
    return h + '</ul>';
  }

  function bindSongRows() {
    var rows = $('view').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      rows[i].onclick = function () {
        playFromList(S.queue, +this.getAttribute('data-i'));
      };
      var ab = rows[i].querySelector('.addbtn');
      if (ab) {
        ab.onclick = function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          var idx = +this.getAttribute('data-add');
          if (S.queue[idx]) coreAdd(S.queue[idx]);
          return false;
        };
      }
    }
  }

  function renderAllSongs(force) {
    if (!force && S.tab !== 'song') return;
    $('libTitle').textContent = '全部歌曲';
    var kw = $('search').value.trim().toLowerCase();
    var all = [];
    Object.keys(S.songs).forEach(function (k) { all = all.concat(S.songs[k]); });
    var needMore = !S.allDone && Object.keys(S.songs).length < S.albums.length;

    var list = kw ? all.filter(function (s) {
      return String(s.name || '').toLowerCase().indexOf(kw) >= 0 || String(s.album || '').toLowerCase().indexOf(kw) >= 0;
    }) : all;

    if (!all.length) {
      $('view').innerHTML = '<div class="loading">正在载入全部曲目…</div>';
      $('libCount').textContent = '载入中 0/' + S.albums.length;
    } else {
      $('libCount').textContent = list.length + ' 首' + (needMore ? ' · 载入中' : '');
      if (!list.length) {
        S.queue = [];
        $('view').innerHTML = '<div class="empty-tip">没有匹配的歌曲</div>';
      } else {
        S.queue = list;
        if (Core.mode === 'shuffle') shuffleQueue();
        $('view').innerHTML = songListHtml(S.queue, true);
        bindSongRows();
        markActive();
      }
    }

    if (needMore && !S.watchPreload) {
      S.watchPreload = true;
      startPreload().then(function () {
        S.watchPreload = false;
        if (S.tab === 'song') renderAllSongs(true);
      });
    }
  }

  function startPreload() {
    if (!S.albums.length) return Promise.resolve();
    if (S.allDone && Object.keys(S.songs).length >= S.albums.length) return Promise.resolve();
    if (preloadPromise && preloadPromise.__running) return preloadPromise;
    return preloadAll();
  }

  var preloadPromise = null;
  function preloadAll() {
    if (preloadPromise && preloadPromise.__running) return preloadPromise;
    if (S.allDone && Object.keys(S.songs).length >= S.albums.length) return Promise.resolve();
    var total = S.albums.length;
    if (!total) return Promise.resolve();
    S.allDone = false;
    var next = 0, doneCnt = 0, inFlight = 0, CONC = 3;
    var p = new Promise(function (resolve) {
      function pump() {
        if (doneCnt >= total) { S.allDone = true; resolve(); return; }
        while (inFlight < CONC && next < total) {
          var a = S.albums[next++];
          if (S.songs[a.id]) { doneCnt++; continue; }
          inFlight++;
          (function (al) {
            loadAlbumSongs(al).catch(function () {}).then(function () {
              inFlight--; doneCnt++;
              if (S.tab === 'song' && $('libCount')) $('libCount').textContent = '载入中 ' + doneCnt + '/' + total;
              setTimeout(pump, 40);
            });
          })(a);
        }
        if (next >= total && inFlight === 0 && doneCnt >= total) { S.allDone = true; resolve(); }
      }
      pump();
    });
    p.__running = true;
    preloadPromise = p;
    p.then(function () { p.__running = false; }, function () { p.__running = false; });
    return p;
  }

  /* ================= 全站搜歌 ================= */

  /* 酷我搜索（首选）：官方 r.s 为 JSONP，浏览器端可跨域取到全站曲库 */
  var kwSeq = 0;
  function kwJsonp(url, timeout) {
    return new Promise(function (resolve, reject) {
      var name = '__kwcb' + (++kwSeq);
      var el = document.createElement('script');
      var done = false;
      function finish(fn, arg) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (el.parentNode) el.parentNode.removeChild(el);
        fn(arg);
      }
      var timer = setTimeout(function () { finish(reject, new Error('搜索超时')); }, timeout || 9000);
      window[name] = function (data) { finish(resolve, data); };
      window.jsonError = function () { finish(reject, new Error('搜索失败')); };
      el.onerror = function () { finish(reject, new Error('网络错误')); };
      el.src = url + '&callback=' + name;
      document.head.appendChild(el);
    });
  }

  function kwSong(m) {
    if (!m) return null;
    var rid = String(m.MUSICRID || '') || (m.DC_TARGETID ? 'MUSIC_' + m.DC_TARGETID : '');
    rid = rid.replace(/^MUSIC_/, '');
    if (!rid) return null;
    var pay = m.payInfo || {};
    return fixSong({
      src: 'kw',
      rid: rid,
      key: 'kw:' + rid,
      name: clean(m.SONGNAME || m.NAME || ''),
      artist: clean(m.ARTIST || '未知歌手'),
      album: clean(m.ALBUM || ''),
      pic: clean(m.web_albumpic_short || m.web_artistpic_short || ''),
      duration: Number(m.DURATION || 0),
      formats: String(m.FORMATS || ''),
      vip: String(((pay.feeType || {}).vip) || '0') !== '0'
    });
  }

  function kwSearchPage(kwName, pn) {
    var url = KW_SEARCH + '?client=kt&all=' + encodeURIComponent(kwName) +
      '&pn=' + (pn * KW_PAGE) + '&rn=' + KW_PAGE +
      '&uid=0&ver=kwplayer_ar_9.2.2.1&vipver=1&show_copyright_off=0&newver=1' +
      '&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1';
    return kwJsonp(url, 9000).then(function (d) {
      var raw = (d && d.abslist) || [];
      /* 时长过短的片段（十几秒的搞笑/试听素材）直接剔除，避免点了只能听一小段 */
      var list = raw.map(kwSong).filter(function (s) {
        return s && s.name && (!s.duration || s.duration >= 45);
      });
      return { list: list, raw: raw.length };
    });
  }

  function apiGet(qs) {
    return fetch(MUSIC_API + '?' + qs, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  var PIC_MEM = {};
  var PIC_TTL = 30 * 24 * 60 * 60 * 1000;
  function picFromCache(pid) {
    if (!pid) return '';
    if (PIC_MEM[pid]) return PIC_MEM[pid];
    try {
      var o = JSON.parse(localStorage.getItem('jay_pic_v1_' + pid) || 'null');
      if (o && o.u && Date.now() - o.t < PIC_TTL) { PIC_MEM[pid] = o.u; return o.u; }
    } catch (e) {}
    return '';
  }
  function picSet(pid, u) {
    if (!pid || !u) return;
    PIC_MEM[pid] = u;
    try { localStorage.setItem('jay_pic_v1_' + pid, JSON.stringify({ t: Date.now(), u: u })); } catch (e) {}
  }
  function fetchPic(song, cb) {
    if (!song || song.src !== 'net' || !song.picId) return;
    var pid = song.picId;
    var hit = picFromCache(pid);
    if (hit) { song.pic = hit; if (cb) cb(hit); return; }
    apiGet('types=pic&source=' + MUSIC_SOURCE + '&id=' + encodeURIComponent(pid) + '&size=500').then(function (j) {
      var u = j && j.url;
      if (!u) return;
      u = String(u).replace(/^http:\/\//i, 'https://');
      picSet(pid, u);
      song.pic = u;
      if (cb) cb(u);
    }).catch(function () {});
  }

  function netSong(m) {
    var id = String((m && (m.url_id || m.id)) || '');
    var artist = m && m.artist;
    if (artist && artist.join) artist = artist.join(' / ');
    return fixSong({
      src: 'net',
      id: id,
      url_id: id,
      key: 'net:' + id,
      name: clean(m && m.name),
      artist: clean(artist || '未知歌手'),
      album: clean((m && m.album) || ''),
      pic: '',
      picId: String((m && m.pic_id) || ''),
      duration: 0,
      formats: ''
    });
  }

  function searchNetPage(kwName, pn) {
    var qs = 'types=search&source=' + MUSIC_SOURCE + '&name=' + encodeURIComponent(kwName) +
      '&count=' + NET_PAGE + '&pages=' + (pn + 1);
    return apiGet(qs).then(function (d) {
      if (d && d.detail) throw new Error(d.detail);
      var raw = (d instanceof Array ? d : []);
      var arr = raw.map(netSong).filter(function (s) { return s.id && s.name; });
      return { list: arr, raw: raw.length };
    });
  }

  /* 搜索总调度：默认走酷我，酷我无结果 / 出错才回落到网易云 */
  function searchAny(kwName, pn, source, allowFallback) {
    if (source === 'net') return searchNetPage(kwName, pn);
    return kwSearchPage(kwName, pn).catch(function () { return { list: [], raw: 0 }; }).then(function (r) {
      if (r.list.length || !allowFallback) return r;
      return searchNetPage(kwName, pn).then(function (n) { n.source = 'net'; return n; });
    });
  }

  function renderNet() {
    var N = S.net;
    $('libTitle').textContent = '全站搜歌';
    if ($('q').value !== N.kw) $('q').value = N.kw;
    $('clearQ').classList.toggle('show', !!N.kw);
    $('hotRow').style.display = N.kw ? 'none' : 'flex';

    if (!N.kw) {
      $('libCount').textContent = '已下架歌曲无法搜索';
      S.queue = [];
      $('view').innerHTML = '<div class="hero">输入关键词，搜索 <b>全网曲库</b>，搜到的歌可点右侧「+」临时加入播放列表。';
      return;
    }
    $('libCount').textContent = '已载入 ' + N.list.length + ' 首' + (N.loading ? ' · 搜索中' : '');

    if (!N.list.length) {
      if (N.loading) { $('view').innerHTML = '<div class="loading">正在搜索「' + esc(N.kw) + '」…</div>'; return; }
      if (N.err) {
        $('view').innerHTML = '<div class="error-box">搜索失败：' + esc(N.err) +
          '<br><span class="retry" id="retrySearch">重试</span></div>';
        var rb = $('retrySearch');
        if (rb) rb.onclick = function () { doNetSearch(N.kw, false, true); };
        return;
      }
      $('view').innerHTML = '<div class="empty-tip">没有找到「' + esc(N.kw) + '」相关的歌曲</div>';
      return;
    }

    var top = $('view').scrollTop;
    S.queue = N.list;
    var h = songListHtml(S.queue, true);
    if (!N.done) {
      h += '<div class="more-wrap"><button class="more" id="moreBtn"' + (N.loading ? ' disabled' : '') + '>' +
        (N.loading ? '加载中…' : '加载更多') + '</button>' +
        '<span class="more-tip">已显示 ' + S.queue.length + ' 首</span></div>';
    }
    $('view').innerHTML = h;
    $('view').scrollTop = top;
    bindSongRows();
    markActive();
    var mb = $('moreBtn');
    if (mb) mb.onclick = function () { if (!N.loading && !N.done) doNetSearch(N.kw, true); };
  }

  function doNetSearch(kw, append, skipCache) {
    kw = String(kw || '').trim();
    var N = S.net;
    if (!kw) {
      N.kw = ''; N.list = []; N.done = true; N.err = ''; N.loading = false;
      renderNet();
      return;
    }
    if (N.loading && kw === N.kw) return;

    var my = ++N.seq;
    var pn = append ? N.pn + 1 : 0;
    if (!append) {
      N.kw = kw; N.list = []; N.done = false; N.pn = 0; N.err = ''; N.source = 'kw';
      try { localStorage.setItem(LAST_KEY, kw); } catch (e) {}
      if (!skipCache) {
        var c = netCacheGet('search_' + kw);
        if (c && c.list && c.list.length) {
          c.list.forEach(fixSong);
          N.list = c.list; N.done = true; N.loading = false;
          N.source = c.source || 'kw';
          renderNet();
          return;
        }
      }
    }
    N.loading = true;
    renderNet();
    fetchNetPage(kw, pn, my, append, 0);
  }

  function dedupeKey(s) { return s.name + '|' + s.artist; }

  function fetchNetPage(kw, pn, my, append, tries) {
    var source = pn === 0 ? 'kw' : (S.net.source || 'kw');
    searchAny(kw, pn, source, pn === 0).then(function (res) {
      var N = S.net;
      if (my !== N.seq) return;
      if (res.source) N.source = res.source;
      var arr = res.list;
      var rawLen = (res.raw == null) ? arr.length : res.raw;
      var pageSize = (N.source === 'net') ? NET_PAGE : KW_PAGE;
      if (append) {
        var seen = {};
        N.list.forEach(function (s) { seen[dedupeKey(s)] = 1; });
        arr = arr.filter(function (s) { return !seen[dedupeKey(s)]; });
        N.list = N.list.concat(arr);
      } else {
        N.list = arr;
      }
      N.pn = pn;
      N.loading = false;
      N.done = rawLen < pageSize;
      if (!append) netCacheSet('search_' + kw, { list: N.list, source: N.source });
      if (S.tab === 'search') renderNet();
    }).catch(function (e) {
      var N = S.net;
      if (my !== N.seq) return;
      if (tries < 1) { setTimeout(function () { fetchNetPage(kw, pn, my, append, tries + 1); }, 900); return; }
      N.loading = false;
      N.err = (e && e.message) || '搜索失败';
      if (S.tab === 'search') renderNet();
    });
  }

  /* ================= 音源解析 ================= */
  function buildSrcUrl(key, song, lv) {
    if (key === 'c') {
      var br = lv === 'lossless' ? '2000kflac' : (lv === 'exhigh' ? '320kmp3' : '128kmp3');
      return SRC.c.url + br + '&rid=' + ridOf(song);
    }
    return SRC[key].url + '?id=' + ridOf(song) + '&level=' + lv;
  }
  function parseSrc(txt) {
    var j = parseLoose(txt);
    if (!j) return '';
    if (j.data && j.data.url) return j.data.url;
    if (j.url) return j.url;
    return '';
  }
  /* 酷我加密格式（mflac/mgg）浏览器无法解码，直接视为不可用 */
  function encSrc(u) { return /\.(mflac|mgg)(\?|$)/i.test(u || ''); }

  function resolveUrl(song, lv, force) {
    song = fixSong(song);
    var ck = song.key + '|' + lv;
    if (force) delete Core.urlCache[ck];
    var hit = Core.urlCache[ck];
    var ttl = song.src === 'net' ? 20 * 60 * 1000 : 5 * 60 * 1000;
    if (hit && Date.now() - hit.t < ttl) return Promise.resolve(hit.url);
    if (song.src === 'net') return resolveNet(song, lv, ck);
    return resolveKw(song, lv, ck).catch(function (e) {
      /* 酷我解析不到，再按同名回落网易云，避免点了不播 */
      return netMatchUrl(song, lv).catch(function () { throw e; });
    });
  }

  /* 酷我曲目解析失败时，用同名歌曲去网易云兜一次 */
  var netMatchCache = {};
  function netMatchUrl(song, lv) {
    var mk = 'm:' + (song.name || '') + '|' + (song.artist || '');
    if (netMatchCache[mk]) return Promise.resolve(netMatchCache[mk]);
    var nm = ((song.name || '') + ' ' + (song.artist || '')).trim();
    return apiGet('types=search&source=' + MUSIC_SOURCE + '&name=' + encodeURIComponent(nm) + '&count=5&pages=1')
      .then(function (d) {
        var arr = (d instanceof Array ? d : []).map(netSong).filter(function (s) { return s.id; });
        if (!arr.length) throw new Error('无匹配');
        var brLv = (lv === 'standard') ? 'standard' : 'exhigh';
        return resolveNet(arr[0], brLv, 'net:' + arr[0].id + '|' + brLv);
      })
      .then(function (u) { netMatchCache[mk] = u; return u; });
  }

  /* ===== 音源增强（本地测试版新增）：海棠网易直解 wy.php =====
     wy.php 一次返回直链 + 封面 + 时长 + 音质，CORS 全开，作为网易首选；
     失败自动回落原 gdstudio 聚合接口。 */
  var NET_WY = 'https://music.haitangw.cc/music/wy.php';
  function durToSec(v) {
    if (typeof v === 'number') return v;
    var m = String(v || '').match(/(\d+)\s*分\s*(\d+)?/);
    if (m) return (parseInt(m[1], 10) || 0) * 60 + (parseInt(m[2] || '0', 10) || 0);
    var n = parseInt(v, 10);
    return isNaN(n) ? 0 : n;
  }
  function wyResolve(song, lv) {
    var id = song.id || song.url_id;
    if (!id) return Promise.reject(new Error('no id'));
    var lvl = lv === 'lossless' ? 'lossless' : (lv === 'exhigh' ? 'exhigh' : 'standard');
    return fetch(NET_WY + '?id=' + encodeURIComponent(id) + '&level=' + lvl + '&type=json', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j = parseLoose(t), d = (j && (j.data || j)) || {};
        if (!d.url || encSrc(d.url)) throw new Error('wy.php 无可用直链');
        if (!song.pic && d.pic) song.pic = d.pic;
        if (!Number(song.duration) && d.duration) song.duration = durToSec(d.duration);
        return d.url;
      });
  }
  function resolveNet(song, lv, ck) {
    return wyResolve(song, lv).catch(function () { return gdResolveNet(song, lv, ck); });
  }
  function gdResolveNet(song, lv, ck) {
    var id = song.id || song.url_id;
    if (!id) return Promise.reject(new Error('无歌曲ID'));
    var want = '320';
    for (var q = 0; q < LEVELS.length; q++) { if (LEVELS[q].key === lv) want = LEVELS[q].br; }
    var brs = [want, '320', '128'].filter(function (v, i, a) { return a.indexOf(v) === i; });
    return new Promise(function (resolve, reject) {
      var i = 0;
      function next() {
        if (i >= brs.length) { reject(new Error('音源不可用')); return; }
        var br = brs[i++];
        apiGet('types=url&source=' + MUSIC_SOURCE + '&id=' + encodeURIComponent(id) + '&br=' + br).then(function (j) {
          var url = j && j.url;
          if (!url) throw new Error('empty');
          Core.urlCache[ck] = { url: url, t: Date.now() };
          resolve(url);
        }).catch(function () { next(); });
      }
      next();
    });
  }

  function resolveKw(song, lv, ck) {
    /* 逐档降级：请求档位取不到就退一档，保证任何一首都能落到能播的码率 */
    var ALL = ['lossless', 'exhigh', 'standard'];
    var st = ALL.indexOf(lv);
    if (st < 0) st = ALL.length - 1;
    var levels = ALL.slice(st);
    return new Promise(function (resolve, reject) {
      var li = 0;
      function nextLevel() {
        if (li >= levels.length) { reject(new Error('全部音源均不可用')); return; }
        var cur = levels[li++];
        var order = ['a', 'b', 'c'];
        var i = 0;
        function tryNext() {
          if (i >= order.length) { nextLevel(); return; }
          var key = order[i++];
          fetch(buildSrcUrl(key, song, cur), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (txt) {
              var url = parseSrc(txt);
              if (!url) throw new Error('empty');
              if (encSrc(url)) throw new Error('encrypted');
              if (!/^https?:/i.test(url)) throw new Error('bad');
              Core.urlCache[ck] = { url: url, t: Date.now() };
              resolve(url);
            })
            .catch(function () { tryNext(); });
        }
        tryNext();
      }
      nextLevel();
    });
  }

  /* ================= 播放控制 ================= */
  function playFromList(list, index, autoplay) {
    if (!list || !list.length) return;
    var song = list[index];
    if (!song) return;
    Core.resumeTime = 0;
    Core.queue = list.slice();
    corePlayAt(index, autoplay);
  }

  function corePlayAt(index, autoplay) {
    var song = Core.queue[index];
    if (!song) return;
    Core.idx = index;
    Core.cur = song;
    markActive();
    renderQueue();
    showSong(song);
    var lv = pickLevel(song, Core.quality);
    renderQuality(song, lv);
    var token = ++Core.token;
    Core.fallbackTried = false;
    setFormatText('', true);
    resolveUrl(song, lv).then(function (url) {
      if (token !== Core.token) return;
      audio.src = url;
      if (Core.resumeTime > 0) {
        var rt = Core.resumeTime;
        Core.resumeTime = 0;
        audio.addEventListener('loadedmetadata', function once() {
          audio.removeEventListener('loadedmetadata', once);
          try { audio.currentTime = rt; } catch (e) {}
        });
      }
      auditFullSong(song, token);
      if (autoplay !== false) {
        audio.play().then(function () { setPlaying(true); }).catch(function () {
          setFormatText('播放失败', true);
        });
      }
      preloadNext();
    }).catch(function () {
      if (token !== Core.token) return;
      stopAudio();
      setFormatText('解析失败', true);
      autoNext(token);
    });
    snapshot();
  }

  /* 停掉当前音频，避免解析失败时旧曲继续播放造成「点了没反应」 */
  function stopAudio() {
    try { audio.pause(); } catch (e) {}
    audio.removeAttribute('src');
    try { audio.load(); } catch (e) {}
    setPlaying(false);
  }

  function autoNext(token) {
    var ni = nextIndex();
    if (ni < 0 || ni === Core.idx) return;
    setTimeout(function () {
      if (token !== Core.token) return;
      corePlayAt(ni, true);
    }, 700);
  }

  /* 完整性校验：拿到真实时长与曲目时长比对，明显偏短判定为试听片段并跳过 */
  function auditFullSong(song, token) {
    var expect = Number((song && song.duration) || 0);
    function onMeta() {
      audio.removeEventListener('loadedmetadata', onMeta);
      if (token !== Core.token) return;
      var real = audio.duration;
      if (!isFinite(real) || real <= 0) return;
      var trial = expect > 0 ? (real + 6 < expect * 0.6 && real < 120) : (real <= 45);
      if (!trial) return;
      stopAudio();
      setFormatText('试听片段', true);
      autoNext(token);
    }
    audio.addEventListener('loadedmetadata', onMeta);
  }

  function preloadNext() {
    var ni = nextIndex();
    if (ni < 0 || ni === Core.idx) return;
    var next = Core.queue[ni];
    if (!next) return;
    var lv = pickLevel(next, Core.quality);
    resolveUrl(next, lv).catch(function () {});
  }

  function nextIndex() {
    var n = Core.queue.length;
    if (!n) return -1;
    if (Core.mode === 'one') return Core.idx;
    if (Core.mode === 'random') {
      if (n === 1) return 0;
      if (Core.idx < 0) return 0;
      var r = Core.idx;
      while (r === Core.idx) { r = Math.floor(Math.random() * n); }
      return r;
    }
    if (Core.idx < 0) return 0;
    return Core.idx + 1 < n ? Core.idx + 1 : -1;
  }

  function shuffleQueue() {
    var q = S.queue;
    if (q.length > 1) {
      for (var i = q.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = q[i]; q[i] = q[j]; q[j] = t;
      }
    }
    var pq = Core.queue;
    if (pq.length > 1) {
      var cur = Core.idx >= 0 ? pq[Core.idx] : null;
      for (var k = pq.length - 1; k > 0; k--) {
        var m = Math.floor(Math.random() * (k + 1));
        var u = pq[k]; pq[k] = pq[m]; pq[m] = u;
      }
      if (cur) Core.idx = pq.indexOf(cur);
    }
    renderQueue();
  }

  /* 临时加入播放列表（不改动任何持久化曲库） */
  function coreAdd(song) {
    if (!song) return;
    fixSong(song);
    Core.queue.push(song);
    if (Core.idx < 0) {
      corePlayAt(Core.queue.length - 1, true);
      toast('已加入播放列表并开始播放');
    } else {
      renderQueue();
      toast('已加入播放列表 · 共 ' + Core.queue.length + ' 首');
      snapshot();
    }
  }

  /* 从播放列表移除 */
  function coreRemove(i) {
    if (i < 0 || i >= Core.queue.length) return;
    var wasCur = i === Core.idx;
    Core.queue.splice(i, 1);
    if (!Core.queue.length) {
      Core.idx = -1;
      Core.cur = null;
      Core.token++;
      audio.pause();
      audio.removeAttribute('src');
      try { audio.load(); } catch (e) {}
      setPlaying(false);
      $('barFill').style.width = '0%';
      $('tCur').textContent = '0:00';
      $('tDur').textContent = '0:00';
      showDefaultCover();
      toast('播放列表已清空');
    } else if (wasCur) {
      var ni = Math.min(i, Core.queue.length - 1);
      corePlayAt(ni, true);
    } else if (i < Core.idx) {
      Core.idx--;
    }
    renderQueue();
    markActive();
    snapshot();
  }

  function coreClear() {
    Core.queue = [];
    Core.idx = -1;
    Core.cur = null;
    Core.token++;
    Core.resumeTime = 0;
    audio.pause();
    audio.removeAttribute('src');
    try { audio.load(); } catch (e) {}
    setPlaying(false);
    $('barFill').style.width = '0%';
    $('tCur').textContent = '0:00';
    $('tDur').textContent = '0:00';
    showDefaultCover();
    renderQueue();
    markActive();
    snapshot();
    toast('播放列表已清空');
  }

  function renderQueue() {
    var n = Core.queue.length;
    $('qBadge').textContent = n;
    $('qCount').textContent = n + ' 首';
    var box = $('qlist');
    if (!n) {
      box.innerHTML = '<li class="qempty">播放列表为空<br>在任意歌曲右侧点「+」即可临时加入</li>';
      return;
    }
    var h = '';
    Core.queue.forEach(function (s, i) {
      var act = i === Core.idx ? ' class="active"' : '';
      h += '<li data-qi="' + i + '"' + act + '>' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="meta"><div class="tname">' + esc(s.name) + '</div>' +
        '<div class="tsub">' + esc(s.artist || '') + (s.album ? ' · ' + esc(s.album) : '') + '</div></div>' +
        '<span class="del" data-del="' + i + '" title="从播放列表移除">&#10005;</span></li>';
    });
    box.innerHTML = h;
    var rows = box.querySelectorAll('li');
    for (var i = 0; i < rows.length; i++) {
      rows[i].onclick = function () {
        var qi = +this.getAttribute('data-qi');
        if (qi === Core.idx) { if (audio.paused) audio.play(); else audio.pause(); return; }
        Core.resumeTime = 0;
        corePlayAt(qi, true);
      };
      var dl = rows[i].querySelector('.del');
      if (dl) {
        dl.onclick = function (ev) {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          coreRemove(+this.getAttribute('data-del'));
          return false;
        };
      }
    }
  }

  function markActive() {
    var cur = Core.cur;
    var at = -1;
    if (cur) {
      var ck = keyOf(cur);
      for (var k = 0; k < S.queue.length; k++) {
        if (keyOf(S.queue[k]) === ck) { at = k; break; }
      }
    }
    var rows = $('view').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', +rows[i].getAttribute('data-i') === at);
    }
  }

  /* 封面兜底链：酷我搜索自带封面 → 酷我解析接口返回的 pic → 网易云同名曲封面 */
  var COVER_FB = {};

  function kwCoverFor(song, cb) {
    if (!song || song.src === 'net' || !ridOf(song)) { cb(''); return; }
    fetch(SRC.b.url + '?id=' + ridOf(song) + '&level=standard', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var j = parseLoose(txt) || {};
        var d = j.data || j;
        var u = d.pic || '';
        if (!u) { cb(''); return; }
        u = String(u).replace(/^http:\/\//i, 'https://').replace(/\/(120|150|300)\//, '/500/');
        cb(u);
      }).catch(function () { cb(''); });
  }

  function netCoverFor(song, cb) {
    var k = keyOf(song);
    if (!k) { cb(''); return; }
    if (COVER_FB[k]) { cb(COVER_FB[k]); return; }
    var q = ((song.name || '') + ' ' + (song.artist || '')).trim();
    apiGet('types=search&source=' + MUSIC_SOURCE + '&name=' + encodeURIComponent(q) + '&count=3&pages=1')
      .then(function (d) {
        var arr = (d instanceof Array ? d : []);
        for (var i = 0; i < arr.length; i++) {
          var pid = arr[i] && arr[i].pic_id;
          if (!pid) continue;
          return apiGet('types=pic&source=' + MUSIC_SOURCE + '&id=' + pid + '&size=500').then(function (j) {
            var u = j && j.url;
            if (!u) { cb(''); return; }
            u = String(u).replace(/^http:\/\//i, 'https://');
            COVER_FB[k] = u;
            cb(u);
          });
        }
      }).catch(function () { cb(''); });
  }

  function paintCover(song, myKey, u) {
    var img = $('coverImg');
    if (!u || img.getAttribute('data-rid') !== myKey) return false;
    img.style.display = 'block';
    img.src = u;
    img.onerror = function () {
      var im = $('coverImg');
      if (im.getAttribute('data-rid') !== myKey) return;
      im.style.display = 'none';
      $('coverIcon').style.display = 'block';
      netCoverFor(song, function (u2) {
        if (!u2 || im.getAttribute('data-rid') !== myKey) return;
        im.style.display = 'block';
        im.src = u2;
        im.onerror = function () { im.style.display = 'none'; $('coverIcon').style.display = 'block'; };
        $('coverIcon').style.display = 'none';
      });
    };
    $('coverIcon').style.display = 'none';
    return true;
  }

  function showSong(song) {
    if (!song) return;
    $('coverTitle').textContent = song.name;
    $('coverArtist').textContent = song.artist || '周杰伦';
    var myKey = keyOf(song);
    var img = $('coverImg');
    img.setAttribute('data-rid', myKey);
    var p = picUrl(song.pic);
    if (!p && song.src === 'net') p = picFromCache(song.picId);
    if (p && paintCover(song, myKey, p)) return;
    img.style.display = 'none';
    $('coverIcon').style.display = 'block';
    if (song.src === 'net') {
      fetchPic(song, function (u) { if (u) paintCover(song, myKey, u); });
      return;
    }
    kwCoverFor(song, function (ku) {
      if (ku && paintCover(song, myKey, ku)) return;
      netCoverFor(song, function (u) { if (u) paintCover(song, myKey, u); });
    });
  }

  function showDefaultCover() {
    var alb = null;
    for (var i = 0; i < S.albums.length; i++) {
      if (/^jay$/i.test(String(S.albums[i].name || '').trim())) { alb = S.albums[i]; break; }
    }
    if (!alb) alb = S.albums[0];
    $('coverTitle').textContent = '让音乐回归纯粹';
    $('coverArtist').textContent = '周杰伦';
    var img = $('coverImg');
    img.removeAttribute('data-rid');
    if (!alb) {
      img.style.display = 'none';
      $('coverIcon').style.display = 'block';
      return;
    }
    var p = picUrl(alb.pic);
    if (!p) { img.style.display = 'none'; $('coverIcon').style.display = 'block'; return; }
    img.style.display = 'block';
    img.src = p;
    img.onerror = function () { img.style.display = 'none'; $('coverIcon').style.display = 'block'; };
    $('coverIcon').style.display = 'none';
  }

  function renderQuality(song, activeLv) {
    var ok = song ? levelsOf(song) : { lossless: true, exhigh: true, standard: true };
    var h = '';
    LEVELS.forEach(function (L) {
      var on = ok[L.key];
      h += '<button class="qbtn' + (L.key === activeLv ? ' act' : '') + (on ? '' : ' off') +
        '" data-q="' + L.key + '">' + L.label + '</button>';
    });
    $('qRow').innerHTML = h;
    var btns = $('qRow').querySelectorAll('.qbtn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () { setQuality(this.getAttribute('data-q')); };
    }
  }

  function setQuality(key) {
    var cur = Core.cur;
    if (cur && !levelsOf(cur)[key]) return;
    Core.quality = key;
    localStorage.setItem('jay_quality', key);
    if (Core.idx >= 0) {
      var wasPlaying = !audio.paused;
      corePlayAt(Core.idx, wasPlaying);
    } else {
      renderQuality(null, key);
    }
    snapshot();
  }

  function setFormatText(txt, plain) {
    var f = $('footer');
    if (!plain) { f.textContent = ''; return; }
    if (txt === '解析失败') f.textContent = '当前曲目暂无完整音源，正在尝试下一首';
    else if (txt === '播放失败') f.textContent = '当前曲目播放失败，可稍后重试或切换音质';
    else if (txt === '试听片段') f.textContent = '该曲目仅有试听片段，已自动跳过';
    else f.textContent = '';
  }

  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6h3.6v14.8H7.6zM12.8 4.6h3.6v14.8h-3.6z"/></svg>';

  function setPlaying(on) {
    var b = $('btnPlay');
    b.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    b.classList.toggle('playing', !!on);
    $('cover').classList.toggle('paused', !on);
  }

  var MODES = [
    { key: 'list',    label: '列表播放' },
    { key: 'one',     label: '单曲循环' },
    { key: 'random',  label: '随机播放' },
    { key: 'shuffle', label: '打乱排序' }
  ];

  function renderModes() {
    var h = '';
    MODES.forEach(function (M) {
      h += '<button class="qbtn' + (M.key === Core.mode ? ' act' : '') + '" data-m="' + M.key + '">' + M.label + '</button>';
    });
    $('mRow').innerHTML = h;
    var btns = $('mRow').querySelectorAll('.qbtn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function () { setMode(this.getAttribute('data-m')); };
    }
  }

  function setMode(key) {
    if (Core.mode === key) return;
    Core.mode = key;
    localStorage.setItem('jay_mode', key);
    if (key === 'shuffle') shuffleQueue();
    renderModes();
    if (S.tab === 'song') renderAllSongs(true);
    else if (S.tab === 'album' && S.curAlbum) renderSongsView(S.queue, S.curAlbum);
    markActive();
    snapshot();
  }

  /* ================= 视图切换（hash 路由，不卸载文档） ================= */
  function showTab(tab) {
    S.tab = tab;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('act', tabs[i].getAttribute('data-tab') === tab);
    }
    var isNet = tab === 'search';
    $('search').style.display = isNet ? 'none' : '';
    $('netWrap').style.display = isNet ? 'flex' : 'none';
    $('hotRow').style.display = isNet && !S.net.kw ? 'flex' : 'none';

    if (isNet) {
      if (!S.net.kw) {
        var last = '';
        try { last = localStorage.getItem(LAST_KEY) || ''; } catch (e) {}
        if (last) {
          S.net.kw = last;
          doNetSearch(last, false);
        } else {
          renderNet();
        }
      } else {
        renderNet();
      }
      if (!S.net.kw) setTimeout(function () { try { $('q').focus(); } catch (e) {} }, 30);
      return;
    }
    if (tab === 'song') { renderAllSongs(true); return; }
    if (S.curAlbum && S.songs[S.curAlbum.id]) {
      S.queue = S.songs[S.curAlbum.id].slice();
      if (Core.mode === 'shuffle') shuffleQueue();
      renderSongsView(S.queue, S.curAlbum);
    } else {
      renderAlbums(true);
    }
  }

  function goTab(tab) {
    if (tab === 'album') S.curAlbum = null;   /* 点“专辑”tab 回到专辑网格 */
    var h = tab === 'search' ? '#/search' : (tab === 'song' ? '#/songs' : '#/');
    if ((location.hash || '') === h) showTab(tab);
    else location.hash = h;
  }

  function applyHash() {
    var h = String(location.hash || '').replace(/^#/, '');
    var tab = 'album';
    if (h.indexOf('/search') === 0) tab = 'search';
    else if (h.indexOf('/songs') === 0) tab = 'song';
    showTab(tab);
  }

  /* ================= 队列快照（会话内刷新可恢复队列） ================= */
  var lastSnap = 0;
  function snapshot() {
    try {
      sessionStorage.setItem(SNAP_KEY, JSON.stringify({
        q: Core.queue.slice(0, 300),
        i: Core.idx,
        t: audio.currentTime || 0,
        lv: Core.quality,
        m: Core.mode
      }));
    } catch (e) {}
    lastSnap = Date.now();
  }

  function restoreSnapshot() {
    try {
      var raw = sessionStorage.getItem(SNAP_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || !o.q || !o.q.length) return;
      o.q.forEach(fixSong);
      Core.queue = o.q;
      Core.idx = (o.i >= 0 && o.i < o.q.length) ? o.i : -1;
      Core.cur = Core.idx >= 0 ? o.q[Core.idx] : null;
      if (o.lv) Core.quality = o.lv;
      if (['list', 'one', 'random', 'shuffle'].indexOf(o.m) >= 0) Core.mode = o.m;
      Core.resumeTime = Number(o.t) || 0;
      if (Core.cur) {
        showSong(Core.cur);
        $('tCur').textContent = fmtTime(Core.resumeTime);
      }
    } catch (e) {}
  }

  var toastTimer = null;
  function toast(txt) {
    var t = $('toast');
    t.textContent = txt;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1700);
  }

  function openDrawer() {
    $('drawer').classList.add('show');
    $('drawerMask').classList.add('show');
    renderQueue();
  }
  function closeDrawer() {
    $('drawer').classList.remove('show');
    $('drawerMask').classList.remove('show');
  }

  /* ================= 事件 ================= */
  $('btnPlay').onclick = function () {
    if (!Core.queue.length) {
      if (S.queue.length) { playFromList(S.queue, 0); }
      return;
    }
    if (!audio.src) {
      corePlayAt(Core.idx >= 0 ? Core.idx : 0, true);
      return;
    }
    if (audio.paused) audio.play(); else audio.pause();
  };
  $('btnPrev').onclick = function () {
    if (Core.idx > 0) { Core.resumeTime = 0; corePlayAt(Core.idx - 1, true); }
  };
  $('btnNext').onclick = function () {
    var ni = nextIndex();
    if (ni >= 0 && ni !== Core.idx) { Core.resumeTime = 0; corePlayAt(ni, true); }
  };

  audio.addEventListener('play', function () { setPlaying(true); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    $('barFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
    $('tCur').textContent = fmtTime(audio.currentTime);
    if (Date.now() - lastSnap > 4000) snapshot();
  });
  audio.addEventListener('loadedmetadata', function () {
    $('tDur').textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('ended', function () {
    if (Core.mode === 'one') {
      audio.currentTime = 0;
      var p = audio.play();
      if (p && p.catch) p.catch(function () {});
      return;
    }
    var ni = nextIndex();
    if (ni >= 0 && ni !== Core.idx) corePlayAt(ni, true);
    else setPlaying(false);
  });
  audio.addEventListener('error', function () {
    if (Core.idx < 0 || !Core.cur) return;
    if (Core.fallbackTried) { setFormatText('播放失败', true); return; }
    Core.fallbackTried = true;
    var song = Core.cur;
    var lv = pickLevel(song, Core.quality);
    var t = ++Core.token;
    var wasPlaying = !audio.paused;
    resolveUrl(song, lv, true).then(function (url) {
      if (t !== Core.token) return;
      audio.src = url;
      if (wasPlaying) audio.play().catch(function () {});
    }).catch(function () {
      if (t !== Core.token) return;
      setFormatText('播放失败', true);
    });
  });

  $('bar').onclick = function (e) {
    if (!audio.duration) return;
    var r = this.getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  };

  $('vol').oninput = function () { audio.volume = this.value / 100; };
  audio.volume = 0.8;

  $('search').oninput = function () {
    if (S.tab === 'album') renderAlbums();
    else if (S.tab === 'song') renderAllSongs();
  };

  var tabs = document.querySelectorAll('.tab');
  for (var t = 0; t < tabs.length; t++) {
    tabs[t].onclick = function () { goTab(this.getAttribute('data-tab')); };
  }
  window.addEventListener('hashchange', applyHash);

  $('btnQueue').onclick = openDrawer;
  $('closeDrawer').onclick = closeDrawer;
  $('drawerMask').onclick = closeDrawer;
  $('clearQueue').onclick = function () { coreClear(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
  });

  /* 全站搜歌输入 */
  var netTimer = null;
  $('q').addEventListener('input', function () {
    var v = this.value;
    $('clearQ').classList.toggle('show', !!v);
    clearTimeout(netTimer);
    netTimer = setTimeout(function () { doNetSearch(v, false); }, 420);
  });
  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(netTimer); doNetSearch(this.value, false, true); }
  });
  $('clearQ').onclick = function () {
    $('q').value = '';
    $('clearQ').classList.remove('show');
    try { localStorage.removeItem(LAST_KEY); } catch (e) {}
    doNetSearch('', false);
    $('q').focus();
  };
  (function () {
    var h = '';
    for (var i = 0; i < HOT.length; i++) {
      h += '<span class="chip" data-k="' + esc(HOT[i]) + '">' + esc(HOT[i]) + '</span>';
    }
    $('hotRow').innerHTML = h;
    var chips = $('hotRow').querySelectorAll('.chip');
    for (var k = 0; k < chips.length; k++) {
      chips[k].onclick = function () {
        var kw = this.getAttribute('data-k');
        $('q').value = kw;
        doNetSearch(kw, false);
      };
    }
  })();

  $('view').addEventListener('scroll', function () {
    if (S.tab !== 'search') return;
    var N = S.net;
    if (N.loading || N.done || !N.kw) return;
    if (this.scrollTop + this.clientHeight >= this.scrollHeight - 90) doNetSearch(N.kw, true);
  });

  /* ================= 播放器与曲库上下等高 ================= */
  function syncHeights() {
    var p = document.querySelector('.player');
    var l = document.querySelector('.library');
    if (!p || !l) return;
    if (window.innerWidth <= 810) {
      if (l.style.height) l.style.height = '';
      return;
    }
    var h = p.offsetHeight;
    if (!h) return;
    if (Math.abs(l.offsetHeight - h) > 1) l.style.height = h + 'px';
  }
  window.addEventListener('resize', syncHeights);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () { syncHeights(); });
    ro.observe(document.querySelector('.player'));
  }
  window.addEventListener('beforeunload', function () { snapshot(); });

  /* 对外暴露全局唯一播放核心，便于调试与验收 */
  window.PlayerCore = Core;

  /* ================= 启动 ================= */
  restoreSnapshot();
  renderQuality(Core.cur, Core.cur ? pickLevel(Core.cur, Core.quality) : Core.quality);
  renderModes();
  setPlaying(false);
  renderQueue();
  syncHeights();
  applyHash();
  loadAlbums();
  setTimeout(syncHeights, 60);
})();
</script>
</body>
</html>
