<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay Chou · 全部歌曲搜索</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #0f0f1a 0%, #16162a 45%, #1d1d33 100%);
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8e8f0; padding: 20px 12px;
    display: flex; align-items: center; justify-content: center;
    align-items: safe center; justify-content: safe center;
  }

  .panel {
    width: 100%; max-width: 820px; height: min(88vh, 900px);
    background: #16162a;
    border: 1px solid rgba(255,215,0,.62); border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,215,0,.12), 0 0 26px rgba(255,215,0,.07);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; flex-shrink: 0; }
  .back-btn {
    background: #202038; border: 1px solid #2a2a48; border-radius: 8px; color: #c8c8e0;
    font-size: 12px; padding: 6px 12px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px; transition: all .2s; flex-shrink: 0;
  }
  .back-btn:hover { border-color: #ffd700; color: #ffd700; }
  .head h1 { font-size: 15px; font-weight: 700; color: #ffd700; letter-spacing: 1px; flex: 1; }
  .head .count { font-size: 12px; color: #8a8aa0; font-variant-numeric: tabular-nums; }

  /* ===== 搜索框 ===== */
  .search-wrap { position: relative; margin: 0 20px 12px; flex-shrink: 0; }
  .search-wrap .glass { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #7a7a92; pointer-events: none; }
  #q {
    width: 100%; background: #202038; border: 1px solid #2a2a48; border-radius: 12px;
    color: #e8e8f0; font-size: 14px; padding: 12px 42px 12px 40px; outline: none; transition: all .2s;
  }
  #q::placeholder { color: #6a6a80; }
  #q:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,.09); }
  .clear-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: #2a2a48; color: #a8a8c8; font-size: 13px; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .clear-btn:hover { background: #3a3a58; color: #ffd700; }
  .clear-btn.show { display: flex; }

  /* ===== 列表 ===== */
  .list-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px 8px 20px; }
  .list-area::-webkit-scrollbar { width: 6px; }
  .list-area::-webkit-scrollbar-thumb { background: #2a2a48; border-radius: 3px; }

  .playlist { list-style: none; }
  .playlist li {
    display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 10px;
    cursor: pointer; transition: background .2s;
  }
  .playlist li:hover { background: #202038; }
  .playlist li.active { background: #24244a; }
  .playlist .num { width: 28px; flex-shrink: 0; font-size: 11.5px; color: #7a7a92; text-align: center; font-variant-numeric: tabular-nums; }
  .playlist li.active .num { color: #ffd700; font-weight: 700; }
  .playlist .meta { flex: 1; min-width: 0; }
  .playlist .tname { font-size: 13.5px; font-weight: 600; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist .tsub { font-size: 11.5px; color: #8a8aa0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist li.active .tname { color: #ffd700; }
  .playlist .dur { font-size: 11.5px; color: #7a7a92; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .playlist li.active .dur { color: #ffd700; }

  .empty-tip, .loading { text-align: center; color: #6a6a80; font-size: 13px; padding: 30px 0; }
  .error-box {
    background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.35);
    border-radius: 12px; padding: 16px 14px; font-size: 12.5px; color: #ff9d9d; line-height: 1.7; margin: 8px 8px 8px 0;
  }
  .error-box .retry {
    display: inline-block; margin-top: 10px; background: #202038; border: 1px solid #2a2a48;
    color: #ffd700; font-size: 12px; padding: 6px 16px; border-radius: 16px; cursor: pointer;
  }

  /* ===== 底部播放条 ===== */
  .bar-area {
    flex-shrink: 0; border-top: 1px solid #23233c; padding: 12px 20px 14px;
    background: rgba(16,16,30,.72); backdrop-filter: blur(6px);
  }
  .now {
    display: flex; align-items: center; gap: 8px; margin-bottom: 9px; min-height: 18px;
  }
  .now .note { color: #ffd700; font-size: 13px; flex-shrink: 0; }
  .now .nm { font-size: 13px; font-weight: 600; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .am { font-size: 11.5px; color: #8a8aa0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 40%; }
  .now .tag { margin-left: auto; font-size: 11px; color: #a8a8c8; flex-shrink: 0; }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .time { font-size: 11px; color: #8a8aa0; width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 5px; background: #2a2a48; border-radius: 3px; position: relative; cursor: pointer; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#ffd700,#ffb800); border-radius: 3px; }
  .bar-fill::after {
    content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; border-radius: 50%; background: #ffd700;
    box-shadow: 0 0 8px rgba(255,215,0,.7); opacity: 0; transition: opacity .2s;
  }
  .bar:hover .bar-fill::after { opacity: 1; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px; }
  .controls button {
    background: none; border: none; cursor: pointer; color: #c8c8e0;
    transition: color .2s, transform .1s; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .controls button svg { display: block; }
  .controls button:hover { color: #ffd700; }
  .controls button:active { transform: scale(.92); }
  .controls .main {
    width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#ffd700,#ffb800);
    color: #16162a; box-shadow: 0 6px 20px rgba(255,215,0,.35);
  }
  .controls .main:hover { color: #10101e; }

  .vol-row { display: flex; align-items: center; gap: 9px; padding: 0 4px; }
  .vol-row .ico { font-size: 13px; color: #8a8aa0; }
  .vol-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: #2a2a48; outline: none; }
  .vol-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #ffd700; cursor: pointer; }

  @media (max-width: 560px) {
    body { padding: 10px 8px; }
    .panel { height: calc(100vh - 20px); border-radius: 18px; }
    .head { padding: 14px 14px 10px; }
    .search-wrap { margin: 0 14px 10px; }
    .list-area { padding: 0 8px 8px 14px; }
    .bar-area { padding: 10px 14px 12px; }
    .now .am { max-width: 34%; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <a class="back-btn" href="index.html">&#8592; 返回播放器</a>
    <h1>全部歌曲</h1>
    <span class="count" id="count">--</span>
  </div>

  <div class="search-wrap">
    <span class="glass">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/>
      </svg>
    </span>
    <input id="q" type="text" placeholder="搜索歌曲、专辑或歌手…" autocomplete="off" autofocus>
    <button class="clear-btn" id="clearQ" title="清空">&#10005;</button>
  </div>

  <div class="list-area" id="list">
    <div class="loading">正在载入曲库…</div>
  </div>

  <div class="bar-area">
    <div class="now">
      <span class="note">&#9835;</span>
      <span class="nm" id="nowName">未播放</span>
      <span class="am" id="nowAlbum"></span>
      <span class="tag" id="nowTag"></span>
    </div>
    <div class="progress-row">
      <span class="time" id="tCur">0:00</span>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="controls">
      <button id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.2 5.4h2.2v13.2H6.2zM17.8 5.4v13.2L9.4 12z"/></svg>
      </button>
      <button class="main" id="btnPlay" title="播放/暂停">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>
      </button>
      <button id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.6 5.4h2.2v13.2h-2.2zM6.2 5.4v13.2L14.6 12z"/></svg>
      </button>
    </div>
    <div class="vol-row">
      <span class="ico">&#128266;</span>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  /* ================= 配置：与播放器一致的曲库地址 ================= */
  var LIB = {
    artistAlbums: 'https://search.kuwo.cn/r.s?stype=albumlist&artistid=336&rn=100&encoding=utf8&rformat=json',
    albumSongs:   'https://search.kuwo.cn/r.s?stype=albuminfo&albumid={id}&vipver=1&encoding=utf8&rformat=json',
    cover:        'https://img1.kuwo.cn/star/albumcover/500/{pic}',
    coverFallback:'https://img3.kuwo.cn/star/albumcover/500/{pic}'
  };

  var SRC = {
    a: { url: 'https://music.haitangw.cc/music/kw.php', type: 'json', byId: true },
    b: { url: 'https://music.haitangw.cc/music/kw1.php', type: 'json', byId: true }
  };

  var LEVELS = [
    { key: 'lossless', label: '无损' },
    { key: 'exhigh',   label: '高品' },
    { key: 'standard', label: '省流' }
  ];

  var CACHE_PREFIX = 'jay_v2_';
  var CACHE_TTL = 24 * 60 * 60 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  var S = {
    albums: [],
    songs: {},
    view: [],        // 当前展示的歌曲（搜索过滤结果）
    playQueue: [],   // 播放队列（点击时快照当前展示列表）
    playIdx: -1,
    curSong: null,
    quality: (function (q) { return q === 'higher' ? 'exhigh' : (q || 'exhigh'); })(localStorage.getItem('jay_quality')),
    urlCache: {},
    loadingAlbum: {},
    allDone: false,
    preloadPromise: null,
    playToken: 0
  };

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseLoose(text) {
    try { return JSON.parse(text); } catch (e) {}
    try { return new Function('return (' + text.replace(/&nbsp;/g, ' ') + ')')(); } catch (e) {}
    return null;
  }
  function clean(s) { return String(s == null ? '' : s).replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim(); }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function ridOf(song) { return String(song.musicrid || song.rid || song.id || '').replace('MUSIC_', ''); }
  function levelsOf(song) {
    var f = String(song.formats || '').toUpperCase();
    var hasFlac = f.indexOf('FLAC') >= 0;
    var hasMp3H = f.indexOf('MP3H') >= 0 || f.indexOf('MP3128') >= 0;
    return { lossless: hasFlac, exhigh: hasMp3H || hasFlac, standard: true };
  }
  function pickLevel(song, want) {
    var ok = levelsOf(song);
    if (ok[want]) return want;
    var order = ['lossless', 'exhigh', 'standard'];
    for (var i = 0; i < order.length; i++) { if (ok[order[i]]) return order[i]; }
    return 'standard';
  }
  function labelOf(key) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === key) return LEVELS[i].label; }
    return '--';
  }

  /* ================= 缓存（与主页共用同一套 key，打开即命中） ================= */
  function cacheGet(k) {
    try {
      var raw = localStorage.getItem(CACHE_PREFIX + k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || Date.now() - o.t > CACHE_TTL) return null;
      return o.d;
    } catch (e) { return null; }
  }
  function cacheSet(k, d) {
    try { localStorage.setItem(CACHE_PREFIX + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }
  function fetchText(url) {
    return fetch(url, { cache: 'force-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }

  /* ================= 曲库 ================= */
  function sortAlbums() {
    S.albums.sort(function (x, y) {
      var a = parseInt(x.year, 10), b = parseInt(y.year, 10);
      var va = isNaN(a) ? 9999 : a, vb = isNaN(b) ? 9999 : b;
      if (va !== vb) return va - vb;
      return String(x.name || '').localeCompare(String(y.name || ''), 'zh');
    });
  }

  function fetchAlbums() {
    return fetchText(LIB.artistAlbums).then(function (t) {
      var d = parseLoose(t);
      var list = (d && (d.albumlist || d.albumList)) || [];
      S.albums = list.map(function (a) {
        return {
          id: String(a.albumid || a.albumId || a.id),
          name: clean(a.name || a.album || a.title),
          year: String(a.pub || a.releaseDate || '').slice(0, 4),
          cnt: Number(a.musiccnt || a.songcount || 0) || 0,
          pic: a.pic || a.img || ''
        };
      }).filter(function (a) { return a.id && a.id !== 'undefined'; });
      sortAlbums();
      cacheSet('albums', S.albums);
      return S.albums;
    });
  }

  function loadAlbumSongs(album) {
    if (S.songs[album.id]) return Promise.resolve(S.songs[album.id]);
    if (S.loadingAlbum[album.id]) return S.loadingAlbum[album.id];
    var cached = cacheGet('songs_' + album.id);
    if (cached && cached.length) {
      S.songs[album.id] = cached;
      return Promise.resolve(cached);
    }
    S.loadingAlbum[album.id] = fetchText(LIB.albumSongs.replace('{id}', album.id)).then(function (t) {
      var d = parseLoose(t) || {};
      var list = d.musiclist || d.musicList || [];
      var arr = list.map(function (m, i) {
        return {
          rid: ridOf(m),
          name: clean(m.name || m.songname),
          artist: clean(m.artist || '周杰伦'),
          album: clean(m.album || album.name),
          albumId: album.id,
          pic: m.pic120 || album.pic || '',
          duration: Number(m.duration || 0),
          formats: m.formats || '',
          no: i + 1
        };
      }).filter(function (s) { return s.rid; });
      S.songs[album.id] = arr;
      cacheSet('songs_' + album.id, arr);
      delete S.loadingAlbum[album.id];
      return arr;
    }).catch(function (e) {
      delete S.loadingAlbum[album.id];
      throw e;
    });
    return S.loadingAlbum[album.id];
  }

  function albumsLoaded() { return Object.keys(S.songs).length; }

  function collectAll() {
    var all = [];
    S.albums.forEach(function (a) {
      var arr = S.songs[a.id];
      if (arr) all = all.concat(arr);
    });
    return all;
  }

  /* 串行限速补齐全部专辑曲目，边补边刷新计数 */
  function preloadAll() {
    if (S.preloadPromise) return S.preloadPromise;
    var i = 0, total = S.albums.length;
    S.preloadPromise = new Promise(function (resolve) {
      function step() {
        if (i >= total) { S.allDone = true; resolve(); return; }
        var a = S.albums[i++];
        if (S.songs[a.id]) { setTimeout(step, 20); return; }
        loadAlbumSongs(a).catch(function () {}).then(function () { renderSoon(); setTimeout(step, 160); });
      }
      step();
    });
    return S.preloadPromise;
  }

  /* ================= 渲染 ================= */
  function renderCount() {
    var total = albumsLoaded(), all = collectAll().length;
    var q = $('q').value.trim();
    if (!S.allDone && total < S.albums.length) {
      $('count').textContent = (q ? S.view.length + ' / ' : '') + all + ' 首 · 载入中 ' + total + '/' + S.albums.length;
    } else {
      $('count').textContent = (q ? S.view.length + ' / ' : '') + all + ' 首';
    }
  }

  function render() {
    var kw = $('q').value.trim().toLowerCase();
    var all = collectAll();

    if (kw) {
      var terms = kw.split(/\s+/).filter(Boolean);
      S.view = all.filter(function (s) {
        var hay = (s.name + ' ' + s.album + ' ' + s.artist).toLowerCase();
        for (var i = 0; i < terms.length; i++) { if (hay.indexOf(terms[i]) < 0) return false; }
        return true;
      });
    } else {
      S.view = all.slice();
    }

    renderCount();
    $('clearQ').classList.toggle('show', !!$('q').value);

    if (!all.length) {
      $('list').innerHTML = '<div class="loading">正在载入曲库…</div>';
      return;
    }
    if (!S.view.length) {
      $('list').innerHTML = '<div class="empty-tip">没有匹配的歌曲</div>';
      return;
    }

    var h = '<ul class="playlist">';
    S.view.forEach(function (s, i) {
      var cls = (S.curSong && ridOf(S.curSong) === ridOf(s)) ? ' class="active"' : '';
      h += '<li data-i="' + i + '"' + cls + '>' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="meta"><div class="tname">' + esc(s.name) + '</div>' +
        '<div class="tsub">' + esc(s.album) + (s.duration ? ' · ' + fmtTime(s.duration) : '') + '</div></div>' +
        '<span class="dur">' + fmtTime(s.duration) + '</span></li>';
    });
    h += '</ul>';
    $('list').innerHTML = h;

    var rows = $('list').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      rows[i].onclick = function () { play(+this.getAttribute('data-i')); };
    }
  }

  var renderTimer = null;
  function renderSoon() {
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 50);
  }

  function markActive() {
    var rows = $('list').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      var s = S.view[+rows[i].getAttribute('data-i')];
      if (s && S.curSong && ridOf(s) === ridOf(S.curSong)) rows[i].classList.add('active');
      else rows[i].classList.remove('active');
    }
  }

  /* ================= 音源解析 ================= */
  function buildSrcUrl(key, song, lv) {
    return SRC[key].url + '?id=' + ridOf(song) + '&level=' + lv;
  }
  function parseSrc(txt) {
    var j = parseLoose(txt);
    if (!j) return '';
    if (j.data && j.data.url) return j.data.url;
    if (j.url) return j.url;
    return '';
  }
  function resolveUrl(song, lv, forceKey) {
    var cacheKey = ridOf(song) + '|' + lv;
    var hit = S.urlCache[cacheKey];
    if (hit && Date.now() - hit.t < 5 * 60 * 1000 && (!forceKey || hit.key === forceKey)) {
      return Promise.resolve(hit.url);
    }
    var order = forceKey ? [forceKey] : ['a', 'b'];
    var i = 0;
    return new Promise(function (resolve, reject) {
      function tryNext() {
        if (i >= order.length) { reject(new Error('全部音源均不可用')); return; }
        var key = order[i++];
        fetch(buildSrcUrl(key, song, lv), { cache: 'no-store' }).then(function (r) {
          return r.text();
        }).then(function (txt) {
          var url = parseSrc(txt);
          if (!url) throw new Error('empty');
          S.urlCache[cacheKey] = { url: url, t: Date.now(), key: key };
          resolve(url);
        }).catch(function () { tryNext(); });
      }
      tryNext();
    });
  }

  /* ================= 播放 ================= */
  function setPlaying(on) {
    var main = $('btnPlay');
    main.innerHTML = on
      ? '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.4 4.8h3.2v14.4H7.4zM13.4 4.8h3.2v14.4h-3.2z"/></svg>'
      : '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>';
  }

  function play(index) {
    var song = S.view[index];
    if (!song) return;
    S.playQueue = S.view.slice();
    playAt(index);
  }

  function playAt(index) {
    var song = S.playQueue[index];
    if (!song) return;
    S.playIdx = index;
    S.curSong = song;
    $('nowName').textContent = song.name;
    $('nowAlbum').textContent = song.album ? '· ' + song.album : '';
    var lv = pickLevel(song, S.quality);
    $('nowTag').textContent = labelOf(lv) + ' · 解析中…';
    markActive();

    var token = ++S.playToken;
    resolveUrl(song, lv).then(function (url) {
      if (token !== S.playToken) return;
      audio.src = url;
      audio.play().then(function () {
        setPlaying(true);
        $('nowTag').textContent = labelOf(lv);
      }).catch(function () {
        setPlaying(false);
        $('nowTag').textContent = labelOf(lv);
      });
    }).catch(function () {
      if (token !== S.playToken) return;
      $('nowTag').textContent = '播放失败';
      setPlaying(false);
    });
  }

  function step(d) {
    if (!S.playQueue.length) return;
    var n = S.playQueue.length;
    var i = S.playIdx < 0 ? 0 : (S.playIdx + d + n) % n;
    playAt(i);
  }

  /* ================= 事件 ================= */
  $('btnPlay').onclick = function () {
    if (!audio.src) {
      if (S.view.length) play(0);
      return;
    }
    if (audio.paused) audio.play().then(function () { setPlaying(true); }).catch(function () {});
    else { audio.pause(); setPlaying(false); }
  };
  $('btnPrev').onclick = function () {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    step(-1);
  };
  $('btnNext').onclick = function () { step(1); };

  $('bar').onclick = function (e) {
    if (!audio.duration) return;
    var r = this.getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  };
  $('vol').oninput = function () { audio.volume = this.value / 100; };
  audio.volume = 0.8;

  audio.addEventListener('timeupdate', function () {
    var d = audio.duration || 0;
    var c = audio.currentTime || 0;
    $('barFill').style.width = (d ? (c / d * 100) : 0) + '%';
    $('tCur').textContent = fmtTime(c);
    $('tDur').textContent = fmtTime(d);
  });
  audio.addEventListener('ended', function () { step(1); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('play', function () { setPlaying(true); });

  $('q').addEventListener('input', renderSoon);
  $('clearQ').onclick = function () {
    $('q').value = '';
    $('q').focus();
    render();
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.activeElement === $('q')) {
      $('q').value = ''; render();
    }
  });

  /* 从本地缓存快速恢复已抓过的专辑曲目，保证进入页面即有内容可搜 */
  function hydrateCache() {
    try {
      var pre = CACHE_PREFIX + 'songs_';
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf(pre) !== 0) continue;
        var id = k.slice(pre.length);
        if (S.songs[id]) continue;
        var arr = cacheGet('songs_' + id);
        if (arr && arr.length) S.songs[id] = arr;
      }
    } catch (e) {}
  }

  /* ================= 启动 ================= */
  function boot() {
    hydrateCache();
    var cachedAlbums = cacheGet('albums');
    if (cachedAlbums && cachedAlbums.length) {
      S.albums = cachedAlbums;
      sortAlbums();
      render();
      preloadAll().then(render);
      fetchAlbums().then(function () { sortAlbums(); }).catch(function () {});
      return;
    }
    $('list').innerHTML = '<div class="loading">正在获取专辑列表…</div>';
    fetchAlbums().then(function () {
      render();
      preloadAll().then(render);
    }).catch(function (e) {
      $('list').innerHTML = '<div class="error-box">专辑列表加载失败：' + esc(e.message) +
        '<br><span class="retry" id="retryAlb">重试</span></div>';
      $('retryAlb').onclick = boot;
    });
  }

  setPlaying(false);
  boot();
})();
</script>
</body>
</html>
