<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>全站搜歌 · JayMusic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #0f0f1a 0%, #16162a 45%, #1d1d33 100%);
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8e8f2;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 20px 16px;
  }
  .panel {
    width: 100%;
    max-width: 880px;
    height: calc(100vh - 40px);
    background: rgba(20, 20, 32, .72);
    border: 1px solid #262640;
    border-radius: 24px;
    backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .head { display: flex; align-items: center; gap: 10px; padding: 20px 22px 12px; }
  .back-btn {
    color: #8a8aa0; text-decoration: none; font-size: 12px; white-space: nowrap;
    border: 1px solid #2a2a48; border-radius: 999px; padding: 5px 11px;
    transition: all .18s;
  }
  .back-btn:hover { color: #ffd700; border-color: #ffd700; }
  .head h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; flex: 1; }
  .count { font-size: 11px; color: #6a6a82; font-variant-numeric: tabular-nums; }

  .search-wrap {
    margin: 0 22px 12px; height: 40px; display: flex; align-items: center; gap: 8px;
    background: #16162a; border: 1px solid #2a2a48; border-radius: 999px; padding: 0 12px;
    transition: border-color .18s;
  }
  .search-wrap:focus-within { border-color: #ffd700; }
  .search-wrap .glass { color: #6a6a82; display: flex; }
  #q {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: #e8e8f2; font-size: 13px; font-family: inherit; padding: 0 2px;
  }
  #q::placeholder { color: #5a5a72; }
  .clear-btn {
    display: none; background: none; border: none; color: #6a6a82; font-size: 12px;
    cursor: pointer; padding: 2px 4px; line-height: 1;
  }
  .clear-btn.show { display: block; }
  .clear-btn:hover { color: #ffd700; }

  .list-area { flex: 1; overflow-y: auto; padding: 0 12px 10px 22px; scrollbar-width: thin; }
  .list-area::-webkit-scrollbar { width: 6px; }
  .list-area::-webkit-scrollbar-thumb { background: #2a2a48; border-radius: 3px; }

  .playlist { list-style: none; }
  .playlist li {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    cursor: pointer; transition: background .16s;
  }
  .playlist li:hover { background: #1c1c30; }
  .playlist li.active { background: rgba(255, 215, 0, .08); }
  .playlist li.active .tname { color: #ffd700; }
  .playlist .num { width: 22px; text-align: right; font-size: 12px; color: #5a5a72; flex: none; }
  .playlist .meta { flex: 1; min-width: 0; }
  .playlist .tname { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist .tsub { font-size: 11px; color: #7a7a92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .playlist .dur { font-size: 11px; color: #5a5a72; flex: none; font-variant-numeric: tabular-nums; }

  .loading, .empty-tip, .error-box {
    padding: 34px 10px; text-align: center; font-size: 12px; color: #7a7a92; line-height: 1.9;
  }
  .error-box { color: #ff8f8f; }
  .error-box .retry {
    display: inline-block; margin-top: 8px; color: #ffd700; cursor: pointer;
    border: 1px solid #3a3a58; border-radius: 999px; padding: 5px 16px; font-size: 12px;
  }

  .hero { padding: 6px 10px 10px; color: #8a8aa0; font-size: 12px; line-height: 1.9; }
  .hero b { color: #ffd700; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 16px; }
  .chip {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px;
    color: #c8c8e0; font-size: 12px; padding: 6px 13px; cursor: pointer;
    transition: all .18s; user-select: none;
  }
  .chip:hover { border-color: #ffd700; color: #ffd700; }

  .more-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0 20px; }
  .more {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px;
    color: #c8c8e0; font-size: 12px; padding: 8px 22px; cursor: pointer; transition: all .18s;
    font-family: inherit;
  }
  .more:hover { border-color: #ffd700; color: #ffd700; }
  .more[disabled] { opacity: .55; cursor: default; }
  .more-tip { font-size: 11px; color: #6a6a82; font-variant-numeric: tabular-nums; }

  .bar-area { border-top: 1px solid #23233c; background: rgba(16, 16, 26, .62); padding: 12px 22px 16px; }
  .now { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; min-width: 0; }
  .now .note { color: #ffd700; font-size: 12px; flex: none; }
  .now .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .am { font-size: 11px; color: #7a7a92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .now .tag {
    margin-left: auto; flex: none; font-size: 10px; color: #ffd700; border: 1px solid #3a3520;
    border-radius: 999px; padding: 2px 9px; cursor: pointer; transition: all .18s;
  }
  .now .tag:hover { border-color: #ffd700; }

  .progress-row { display: flex; align-items: center; gap: 8px; }
  .progress-row .time { font-size: 10px; color: #6a6a82; font-variant-numeric: tabular-nums; flex: none; }
  .bar { flex: 1; height: 4px; background: #2a2a48; border-radius: 2px; cursor: pointer; position: relative; }
  .bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: #ffd700; border-radius: 2px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 10px; }
  .controls button {
    background: none; border: none; color: #c8c8e0; cursor: pointer; display: flex;
    align-items: center; justify-content: center; padding: 4px; border-radius: 50%; transition: all .18s;
  }
  .controls button:hover { color: #ffd700; }
  .controls .main {
    width: 42px; height: 42px; border: 1px solid #2a2a48; background: #1a1a2c; color: #ffd700;
  }
  .controls .main:hover { border-color: #ffd700; background: #20203a; }

  .vol-row { display: flex; align-items: center; gap: 9px; padding: 0 4px; margin-top: 10px; }
  .vol-row .ico { font-size: 13px; color: #8a8aa0; }
  .vol-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: #2a2a48; outline: none; }
  .vol-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #ffd700; cursor: pointer;
  }

  @media (max-width: 560px) {
    body { padding: 10px 8px; }
    .panel { height: calc(100vh - 20px); border-radius: 18px; }
    .head { padding: 14px 14px 10px; }
    .search-wrap { margin: 0 14px 10px; }
    .list-area { padding: 0 8px 8px 14px; }
    .bar-area { padding: 10px 14px 12px; }
    .now .am { max-width: 34%; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <a class="back-btn" href="index.html">&#8592; 返回播放器</a>
    <h1>全站搜歌</h1>
    <span class="count" id="count">--</span>
  </div>

  <div class="search-wrap">
    <span class="glass">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/>
      </svg>
    </span>
    <input id="q" type="text" placeholder="搜索全网歌曲、歌手、专辑…" autocomplete="off" autofocus>
    <button class="clear-btn" id="clearQ" title="清空">&#10005;</button>
  </div>

  <div class="list-area" id="list"></div>

  <div class="bar-area">
    <div class="now">
      <span class="note">&#9835;</span>
      <span class="nm" id="nowName">未播放</span>
      <span class="am" id="nowAlbum"></span>
      <span class="tag" id="nowTag"></span>
    </div>
    <div class="progress-row">
      <span class="time" id="tCur">0:00</span>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="controls">
      <button id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.2 5.4h2.2v13.2H6.2zM17.8 5.4v13.2L9.4 12z"/></svg>
      </button>
      <button class="main" id="btnPlay" title="播放/暂停">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>
      </button>
      <button id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.6 5.4h2.2v13.2h-2.2zM6.2 5.4v13.2L14.6 12z"/></svg>
      </button>
    </div>
    <div class="vol-row">
      <span class="ico">&#128266;</span>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  /* 搜索与取流：跨域聚合接口，曲库覆盖全网歌手（不止周杰伦） */
  var MUSIC_API = 'https://music-api.gdstudio.xyz/api.php';
  var MUSIC_SOURCE = 'netease';

  var LEVELS = [
    { key: '999', label: '无损' },
    { key: '320', label: '超品' },
    { key: '128', label: '标准' }
  ];

  var PAGE_SIZE = 30;
  var SEARCH_TTL = 30 * 60 * 1000;
  var URL_TTL = 20 * 60 * 1000;
  var LAST_KEY = 'jay_v3_lastsearch';
  var Q_KEY = 'jay_search_quality';
  var HOT = ['林俊杰', '邓紫棋', '陈奕迅', '薛之谦', '李荣浩', '毛不易', '周深', '华晨宇', 'Taylor Swift', '告五人'];

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  var S = {
    list: [],
    playQueue: [],
    playIdx: -1,
    curSong: null,
    kw: '',
    pn: 0,
    loading: false,
    done: true,
    err: '',
    seq: 0,
    playToken: 0,
    urlCache: {},
    quality: (function (q) { return (q === '999' || q === '320' || q === '128') ? q : '320'; })(localStorage.getItem(Q_KEY))
  };

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, ' ').trim();
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function labelOf(key) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === key) return LEVELS[i].label; }
    return '--';
  }
  function idOf(song) { return String((song && (song.url_id || song.id)) || ''); }
  function pickLevel(want) { return (want === '999' || want === '320' || want === '128') ? want : '320'; }

  /* ================= 缓存 ================= */
  function cacheGet(k) {
    try {
      var raw = localStorage.getItem('jay_v3_' + k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || Date.now() - o.t > SEARCH_TTL) return null;
      return o.d;
    } catch (e) { return null; }
  }
  function cacheSet(k, d) {
    try { localStorage.setItem('jay_v3_' + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }

  /* ================= 接口 ================= */
  function apiGet(qs) {
    return fetch(MUSIC_API + '?' + qs, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function normalize(m) {
    var id = String((m && (m.url_id || m.id)) || '');
    var artist = m && m.artist;
    if (artist && artist.join) artist = artist.join(' / ');
    return {
      id: id,
      url_id: id,
      pic_id: (m && m.pic_id) || '',
      name: clean(m && m.name),
      artist: clean(artist || '未知歌手'),
      album: clean((m && m.album) || ''),
      duration: 0
    };
  }

  function searchPage(kw, pn) {
    var qs = 'types=search&source=' + MUSIC_SOURCE + '&name=' + encodeURIComponent(kw) +
      '&count=' + PAGE_SIZE + '&pages=' + (pn + 1);
    return apiGet(qs).then(function (d) {
      if (d && d.detail) throw new Error(d.detail);
      var arr = (d instanceof Array ? d : []).map(normalize).filter(function (s) { return s.id && s.name; });
      return { list: arr };
    });
  }

  /* ================= 渲染 ================= */
  function heroHtml() {
    var h = '<div class="hero">输入关键词，搜索 <b>全网曲库</b>，任何歌手的歌都能搜到、都能播。</div><div class="chips">';
    for (var i = 0; i < HOT.length; i++) h += '<span class="chip" data-k="' + esc(HOT[i]) + '">' + esc(HOT[i]) + '</span>';
    return h + '</div>';
  }

  function renderCount() {
    if (!S.kw) { $('count').textContent = '--'; return; }
    $('count').textContent = '已载入 ' + S.list.length + ' 首' + (S.loading ? ' · 搜索中' : '');
  }

  function render() {
    renderCount();
    $('clearQ').classList.toggle('show', !!$('q').value);
    var box = $('list');

    if (!S.kw) { box.innerHTML = heroHtml(); bindChips(); box.scrollTop = 0; return; }

    if (!S.list.length) {
      if (S.loading) { box.innerHTML = '<div class="loading">正在搜索「' + esc(S.kw) + '」…</div>'; return; }
      if (S.err) {
        box.innerHTML = '<div class="error-box">搜索失败：' + esc(S.err) + '<br><span class="retry" id="retrySearch">重试</span></div>';
        var rb = $('retrySearch');
        if (rb) rb.onclick = function () { doSearch(S.kw, false, true); };
        return;
      }
      box.innerHTML = '<div class="empty-tip">没有找到「' + esc(S.kw) + '」相关的歌曲</div>';
      return;
    }

    var h = '<ul class="playlist">';
    for (var i = 0; i < S.list.length; i++) {
      var s = S.list[i];
      var cls = (S.curSong && idOf(S.curSong) === idOf(s)) ? ' class="active"' : '';
      var sub = s.artist + (s.album ? ' · ' + s.album : '');
      h += '<li data-i="' + i + '"' + cls + '>' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="meta"><div class="tname">' + esc(s.name) + '</div>' +
        '<div class="tsub">' + esc(sub) + '</div></div>' +
        '<span class="dur">' + (s.duration ? fmtTime(s.duration) : '') + '</span></li>';
    }
    h += '</ul>';
    if (!S.done) {
      h += '<div class="more-wrap"><button class="more" id="moreBtn"' + (S.loading ? ' disabled' : '') + '>' +
        (S.loading ? '加载中…' : '加载更多') + '</button>' +
        '<span class="more-tip">已显示 ' + S.list.length + ' 首</span></div>';
    }
    box.innerHTML = h;

    var rows = box.querySelectorAll('.playlist li');
    for (var k = 0; k < rows.length; k++) {
      rows[k].onclick = function () { play(+this.getAttribute('data-i')); };
    }
    var mb = $('moreBtn');
    if (mb) mb.onclick = function () { if (!S.loading && !S.done) doSearch(S.kw, true); };
  }

  function bindChips() {
    var chips = $('list').querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].onclick = function () {
        var k = this.getAttribute('data-k');
        $('q').value = k;
        doSearch(k, false);
      };
    }
  }

  /* ================= 搜索流程 ================= */
  function doSearch(kw, append, skipCache) {
    kw = String(kw || '').trim();
    if (!kw) {
      S.kw = ''; S.list = []; S.done = true; S.err = ''; S.loading = false;
      render();
      return;
    }
    if (S.loading) return;

    var my = ++S.seq;
    var pn = append ? S.pn + 1 : 0;
    if (!append) {
      S.kw = kw; S.list = []; S.done = false; S.pn = 0; S.err = '';
      try { localStorage.setItem(LAST_KEY, kw); } catch (e) {}
      if (!skipCache) {
        var c = cacheGet('search_' + kw);
        if (c && c.list && c.list.length) {
          S.list = c.list; S.done = true; S.loading = false;
          render();
          return;
        }
      }
    }
    S.loading = true;
    render();
    fetchPage(kw, pn, my, append, 0);
  }

  function dedupeKey(s) { return s.name + '|' + s.artist; }

  function fetchPage(kw, pn, my, append, tries) {
    searchPage(kw, pn).then(function (res) {
      if (my !== S.seq) return;
      var arr = res.list;
      var rawLen = arr.length;
      if (append) {
        var seen = {};
        S.list.forEach(function (s) { seen[dedupeKey(s)] = 1; });
        arr = arr.filter(function (s) { return !seen[dedupeKey(s)]; });
        S.list = S.list.concat(arr);
      } else {
        S.list = arr;
      }
      S.pn = pn;
      S.loading = false;
      S.done = rawLen < PAGE_SIZE;
      if (!append) cacheSet('search_' + kw, { list: S.list });
      render();
    }).catch(function (e) {
      if (my !== S.seq) return;
      if (tries < 1) { setTimeout(function () { fetchPage(kw, pn, my, append, tries + 1); }, 900); return; }
      S.loading = false;
      S.err = (e && e.message) || '搜索失败';
      render();
    });
  }

  /* ================= 播放 ================= */
  function resolveUrl(song, br) {
    var id = idOf(song);
    if (!id) return Promise.reject(new Error('无歌曲ID'));
    var key = id + '|' + br;
    var hit = S.urlCache[key];
    if (hit && Date.now() - hit.t < URL_TTL) return Promise.resolve(hit.url);
    var brs = [br, '320', '128'].filter(function (v, i, a) { return a.indexOf(v) === i; });
    function attempt(i) {
      if (i >= brs.length) return Promise.reject(new Error('音源不可用'));
      return apiGet('types=url&source=' + MUSIC_SOURCE + '&id=' + encodeURIComponent(id) + '&br=' + brs[i])
        .then(function (j) {
          var url = j && j.url;
          if (!url) throw new Error('empty');
          S.urlCache[key] = { url: url, t: Date.now() };
          return url;
        })
        .catch(function () { return attempt(i + 1); });
    }
    return attempt(0);
  }

  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 4.6h3.4v14.8H7zm6.6 0H17v14.8h-3.4z"/></svg>';
  function setPlaying(p) { $('btnPlay').innerHTML = p ? ICON_PAUSE : ICON_PLAY; }

  function markActive() {
    var rows = $('list').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      var s = S.list[+rows[i].getAttribute('data-i')];
      if (S.curSong && s && idOf(s) === idOf(S.curSong)) rows[i].classList.add('active');
      else rows[i].classList.remove('active');
    }
  }

  function playAt(i) {
    if (i < 0 || i >= S.playQueue.length) return;
    var song = S.playQueue[i];
    S.playIdx = i;
    S.curSong = song;
    var lv = pickLevel(S.quality);
    var token = ++S.playToken;
    markActive();
    $('nowName').textContent = song.name || '未知歌曲';
    $('nowAlbum').textContent = [song.artist, song.album].filter(Boolean).join(' · ');
    $('nowTag').textContent = labelOf(lv);
    setPlaying(false);
    resolveUrl(song, lv).then(function (url) {
      if (token !== S.playToken) return null;
      audio.src = url;
      return audio.play();
    }).then(function () {
      if (token === S.playToken) setPlaying(true);
    }).catch(function (e) {
      if (token !== S.playToken) return;
      setPlaying(false);
      $('nowAlbum').textContent = '音源解析失败：' + ((e && e.message) || '未知原因') + '，可试下一首';
    });
  }

  function play(i) {
    S.playQueue = S.list.slice();
    playAt(i);
  }

  function step(delta) {
    if (!S.playQueue.length) return;
    var n = S.playQueue.length;
    var i = S.playIdx < 0 ? 0 : (S.playIdx + delta + n) % n;
    playAt(i);
  }

  /* ================= 事件 ================= */
  var timer = null;
  $('q').addEventListener('input', function () {
    clearTimeout(timer);
    var v = this.value;
    timer = setTimeout(function () { doSearch(v, false); }, 420);
  });

  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(timer); doSearch(this.value, false, true); }
  });

  $('clearQ').onclick = function () {
    $('q').value = '';
    try { localStorage.removeItem(LAST_KEY); } catch (e) {}
    doSearch('', false);
    $('q').focus();
  };

  $('list').addEventListener('scroll', function () {
    if (S.loading || S.done || !S.kw) return;
    if (this.scrollTop + this.clientHeight >= this.scrollHeight - 90) doSearch(S.kw, true);
  });

  $('btnPlay').onclick = function () {
    if (!S.curSong) {
      if (S.list.length) play(0);
      return;
    }
    if (audio.paused) {
      if (!audio.src) playAt(S.playIdx < 0 ? 0 : S.playIdx);
      else audio.play();
    } else {
      audio.pause();
    }
  };
  $('btnPrev').onclick = function () { step(-1); };
  $('btnNext').onclick = function () { step(1); };

  $('bar').onclick = function (e) {
    if (!audio.duration) return;
    var r = this.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    audio.currentTime = p * audio.duration;
  };

  $('vol').oninput = function () { audio.volume = this.value / 100; };
  audio.volume = 0.8;

  audio.addEventListener('timeupdate', function () {
    var d = audio.duration || 0;
    $('tCur').textContent = fmtTime(audio.currentTime);
    $('tDur').textContent = fmtTime(d);
    $('barFill').style.width = d ? (audio.currentTime / d * 100) + '%' : '0%';
  });
  audio.addEventListener('ended', function () { step(1); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('play', function () { setPlaying(true); });

  $('nowTag').onclick = function () {
    var idx = 1;
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === S.quality) idx = i; }
    S.quality = LEVELS[(idx + 1) % LEVELS.length].key;
    try { localStorage.setItem(Q_KEY, S.quality); } catch (e) {}
    if (S.curSong) playAt(S.playIdx < 0 ? 0 : S.playIdx);
    else $('nowTag').textContent = labelOf(S.quality);
  };

  /* ================= 启动 ================= */
  setPlaying(false);
  $('nowTag').textContent = labelOf(S.quality);
  render();
  (function () {
    var last = '';
    try { last = localStorage.getItem(LAST_KEY) || ''; } catch (e) {}
    if (last) { $('q').value = last; doSearch(last, false); }
  })();
})();
</script>
</body>
</html>
