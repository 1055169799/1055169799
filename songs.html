<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全站搜歌 · JayMusic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #0f0f1a 0%, #16162a 45%, #1d1d33 100%);
    font-family: 'Segoe UI', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e8e8f0; padding: 20px 12px;
    display: flex; align-items: center; justify-content: center;
    align-items: safe center; justify-content: safe center;
  }

  .panel {
    width: 100%; max-width: 820px; height: min(88vh, 900px);
    background: #16162a;
    border: 1px solid rgba(255,215,0,.62); border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,215,0,.12), 0 0 26px rgba(255,215,0,.07);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  .head { display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; flex-shrink: 0; }
  .back-btn {
    background: #202038; border: 1px solid #2a2a48; border-radius: 8px; color: #c8c8e0;
    font-size: 12px; padding: 6px 12px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px; transition: all .2s; flex-shrink: 0;
  }
  .back-btn:hover { border-color: #ffd700; color: #ffd700; }
  .head h1 { font-size: 15px; font-weight: 700; color: #ffd700; letter-spacing: 1px; flex: 1; }
  .head .count { font-size: 12px; color: #8a8aa0; font-variant-numeric: tabular-nums; }

  /* ===== 搜索框 ===== */
  .search-wrap { position: relative; margin: 0 20px 12px; flex-shrink: 0; }
  .search-wrap .glass { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #7a7a92; pointer-events: none; }
  #q {
    width: 100%; background: #202038; border: 1px solid #2a2a48; border-radius: 12px;
    color: #e8e8f0; font-size: 14px; padding: 12px 42px 12px 40px; outline: none; transition: all .2s;
  }
  #q::placeholder { color: #6a6a80; }
  #q:focus { border-color: #ffd700; box-shadow: 0 0 0 3px rgba(255,215,0,.09); }
  .clear-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: #2a2a48; color: #a8a8c8; font-size: 13px; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .clear-btn:hover { background: #3a3a58; color: #ffd700; }
  .clear-btn.show { display: flex; }

  /* ===== 列表 ===== */
  .list-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 12px 8px 20px; }
  .list-area::-webkit-scrollbar { width: 6px; }
  .list-area::-webkit-scrollbar-thumb { background: #2a2a48; border-radius: 3px; }

  .playlist { list-style: none; }
  .playlist li {
    display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 10px;
    cursor: pointer; transition: background .2s;
  }
  .playlist li:hover { background: #202038; }
  .playlist li.active { background: #24244a; }
  .playlist .num { width: 28px; flex-shrink: 0; font-size: 11.5px; color: #7a7a92; text-align: center; font-variant-numeric: tabular-nums; }
  .playlist li.active .num { color: #ffd700; font-weight: 700; }
  .playlist .meta { flex: 1; min-width: 0; }
  .playlist .tname { font-size: 13.5px; font-weight: 600; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist .tsub { font-size: 11.5px; color: #8a8aa0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .playlist li.active .tname { color: #ffd700; }
  .playlist .dur { font-size: 11.5px; color: #7a7a92; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .playlist li.active .dur { color: #ffd700; }

  .empty-tip, .loading { text-align: center; color: #6a6a80; font-size: 13px; padding: 30px 0; }
  .error-box {
    background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.35);
    border-radius: 12px; padding: 16px 14px; font-size: 12.5px; color: #ff9d9d; line-height: 1.7; margin: 8px 8px 8px 0;
  }
  .error-box .retry {
    display: inline-block; margin-top: 10px; background: #202038; border: 1px solid #2a2a48;
    color: #ffd700; font-size: 12px; padding: 6px 16px; border-radius: 16px; cursor: pointer;
  }

  /* ===== 底部播放条 ===== */
  .bar-area {
    flex-shrink: 0; border-top: 1px solid #23233c; padding: 12px 20px 14px;
    background: rgba(16,16,30,.72); backdrop-filter: blur(6px);
  }
  .now {
    display: flex; align-items: center; gap: 8px; margin-bottom: 9px; min-height: 18px;
  }
  .now .note { color: #ffd700; font-size: 13px; flex-shrink: 0; }
  .now .nm { font-size: 13px; font-weight: 600; color: #f2f2f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .am { font-size: 11.5px; color: #8a8aa0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; max-width: 40%; }
  .now .tag { margin-left: auto; font-size: 11px; color: #a8a8c8; flex-shrink: 0; }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .time { font-size: 11px; color: #8a8aa0; width: 38px; text-align: center; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 5px; background: #2a2a48; border-radius: 3px; position: relative; cursor: pointer; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#ffd700,#ffb800); border-radius: 3px; }
  .bar-fill::after {
    content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; border-radius: 50%; background: #ffd700;
    box-shadow: 0 0 8px rgba(255,215,0,.7); opacity: 0; transition: opacity .2s;
  }
  .bar:hover .bar-fill::after { opacity: 1; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px; }
  .controls button {
    background: none; border: none; cursor: pointer; color: #c8c8e0;
    transition: color .2s, transform .1s; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .controls button svg { display: block; }
  .controls button:hover { color: #ffd700; }
  .controls button:active { transform: scale(.92); }
  .controls .main {
    width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#ffd700,#ffb800);
    color: #16162a; box-shadow: 0 6px 20px rgba(255,215,0,.35);
  }
  .controls .main:hover { color: #10101e; }

  .vol-row { display: flex; align-items: center; gap: 9px; padding: 0 4px; }
  .vol-row .ico { font-size: 13px; color: #8a8aa0; }
  .vol-row input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: #2a2a48; outline: none; }
  .vol-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #ffd700; cursor: pointer; }

  @media (max-width: 560px) {
    body { padding: 10px 8px; }
    .panel { height: calc(100vh - 20px); border-radius: 18px; }
    .head { padding: 14px 14px 10px; }
    .search-wrap { margin: 0 14px 10px; }
    .list-area { padding: 0 8px 8px 14px; }
    .bar-area { padding: 10px 14px 12px; }
    .now .am { max-width: 34%; }
  }

  /* ===== 新增：热门词 / 加载更多 ===== */
  .hero { padding: 2px 22px 10px; color: #8a8aa0; font-size: 12px; line-height: 1.9; }
  .hero b { color: #ffd700; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; }
  .chip {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px;
    color: #c8c8e0; font-size: 12px; padding: 6px 13px; cursor: pointer;
    transition: all .18s; user-select: none;
  }
  .chip:hover { border-color: #ffd700; color: #ffd700; }
  .more-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 0 20px; }
  .more {
    background: #202038; border: 1px solid #2a2a48; border-radius: 999px;
    color: #c8c8e0; font-size: 12px; padding: 8px 22px; cursor: pointer; transition: all .18s;
  }
  .more:hover { border-color: #ffd700; color: #ffd700; }
  .more[disabled] { opacity: .55; cursor: default; }
  .more-tip { font-size: 11px; color: #6a6a82; font-variant-numeric: tabular-nums; }
  .now .tag { cursor: pointer; }
  .now .tag:hover { color: #ffd700; border-color: #ffd700; }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <a class="back-btn" href="index.html">&#8592; 返回播放器</a>
    <h1>全站搜歌</h1>
    <span class="count" id="count">--</span>
  </div>

  <div class="search-wrap">
    <span class="glass">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/>
      </svg>
    </span>
    <input id="q" type="text" placeholder="搜索全网歌曲、歌手、专辑…" autocomplete="off" autofocus>
    <button class="clear-btn" id="clearQ" title="清空">&#10005;</button>
  </div>

  <div class="list-area" id="list"></div>

  <div class="bar-area">
    <div class="now">
      <span class="note">&#9835;</span>
      <span class="nm" id="nowName">未播放</span>
      <span class="am" id="nowAlbum"></span>
      <span class="tag" id="nowTag"></span>
    </div>
    <div class="progress-row">
      <span class="time" id="tCur">0:00</span>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      <span class="time" id="tDur">0:00</span>
    </div>
    <div class="controls">
      <button id="btnPrev" title="上一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.2 5.4h2.2v13.2H6.2zM17.8 5.4v13.2L9.4 12z"/></svg>
      </button>
      <button class="main" id="btnPlay" title="播放/暂停">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>
      </button>
      <button id="btnNext" title="下一首">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.6 5.4h2.2v13.2h-2.2zM6.2 5.4v13.2L14.6 12z"/></svg>
      </button>
    </div>
    <div class="vol-row">
      <span class="ico">&#128266;</span>
      <input type="range" id="vol" min="0" max="100" value="80">
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  /* 搜索：沿用曲库同一套酷我接口（JSONP 方式调用，可跨域搜索全站歌曲） */
  var SEARCH_API = 'https://search.kuwo.cn/r.s?client=kt&all={kw}&pn={pn}&rn={rn}&uid=0&ver=kwplayer_ar_9.2.2.1&vipver=1&show_copyright_off=1&newver=1&ft=music&cluster=0&strategy=2012&encoding=utf8&rformat=json&vermerge=1&mobi=1&issubtitle=1';

  /* 音源：与播放器一致的解析接口（按歌曲 rid 取流） */
  var SRC = {
    a: 'https://music.haitangw.cc/music/kw.php',
    b: 'https://music.haitangw.cc/music/kw1.php'
  };

  var LEVELS = [
    { key: 'lossless', label: '无损' },
    { key: 'exhigh',   label: '高品' },
    { key: 'standard', label: '省流' }
  ];

  var PAGE_SIZE = 30;
  var SEARCH_TTL = 30 * 60 * 1000;
  var URL_TTL = 20 * 60 * 1000;
  var LAST_KEY = 'jay_v2_lastsearch';
  var HOT = ['周杰伦', '林俊杰', '邓紫棋', '陈奕迅', '薛之谦', '李荣浩', '晴天', '稻香', '告白气球', '七里香', '夜曲', '起风了'];

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');

  var S = {
    list: [],
    playQueue: [],
    playIdx: -1,
    curSong: null,
    kw: '',
    pn: 0,
    total: 0,
    loading: false,
    done: true,
    err: '',
    seq: 0,
    playToken: 0,
    urlCache: {},
    quality: (function (q) { return q === 'higher' ? 'exhigh' : (q || 'exhigh'); })(localStorage.getItem('jay_quality'))
  };

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clean(s) {
    return String(s == null ? '' : s)
      .replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      .replace(/\s+/g, ' ').trim();
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function ridOf(song) { return String(song && song.rid || '').replace(/^MUSIC_/, ''); }
  function parseLoose(text) {
    try { return JSON.parse(text); } catch (e) {}
    try { return new Function('return (' + text.replace(/&nbsp;/g, ' ') + ')')(); } catch (e) {}
    return null;
  }
  function labelOf(key) {
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === key) return LEVELS[i].label; }
    return '--';
  }
  function levelsOf(song) {
    var f = String(song && song.formats || '').toLowerCase();
    return {
      lossless: f.indexOf('flac') >= 0,
      exhigh: f.indexOf('bitrate:320') >= 0 || f.indexOf('format:mp3') >= 0 || f.indexOf('flac') >= 0,
      standard: true
    };
  }
  function pickLevel(song, want) {
    var ok = levelsOf(song);
    if (ok[want]) return want;
    var order = ['lossless', 'exhigh', 'standard'];
    for (var i = 0; i < order.length; i++) { if (ok[order[i]]) return order[i]; }
    return 'standard';
  }

  /* ================= 搜索缓存 ================= */
  function cacheGet(k) {
    try {
      var raw = localStorage.getItem('jay_v2_' + k);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.t || Date.now() - o.t > SEARCH_TTL) return null;
      return o.d;
    } catch (e) { return null; }
  }
  function cacheSet(k, d) {
    try { localStorage.setItem('jay_v2_' + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }

  /* ================= JSONP：跨域调用酷我搜索 ================= */
  var cbSeq = 0;
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cb = '__kwcb' + (++cbSeq) + '_' + Math.random().toString(36).slice(2, 8);
      var sc = document.createElement('script');
      var finished = false;
      var timer = setTimeout(function () { done(new Error('请求超时')); }, 15000);
      function done(err, data) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        if (err) reject(err); else resolve(data);
      }
      window[cb] = function (data) { done(null, data); };
      sc.onerror = function () { done(new Error('网络异常')); };
      sc.src = url + '&callback=' + cb;
      document.head.appendChild(sc);
    });
  }

  function normalize(m) {
    return {
      rid: String(m.MUSICRID || m.MP3RID || '').replace(/^MUSIC_/, ''),
      name: clean(m.SONGNAME || m.NAME),
      artist: clean(m.ARTIST || m.AARTIST || '未知歌手'),
      album: clean(m.ALBUM || ''),
      duration: Number(m.DURATION || 0) || 0,
      formats: String(m.FORMATS || '') + '|' + String(m.MINFO || '')
    };
  }

  function searchPage(kw, pn) {
    var url = SEARCH_API.replace('{kw}', encodeURIComponent(kw)).replace('{pn}', pn).replace('{rn}', PAGE_SIZE);
    return jsonp(url).then(function (d) {
      var arr = ((d && d.abslist) || []).map(normalize).filter(function (s) { return s.rid && s.name; });
      return { list: arr, total: Number(d && d.TOTAL || 0) || 0 };
    });
  }

  /* ================= 渲染 ================= */
  function heroHtml() {
    var h = '<div class="hero">输入关键词，搜索 <b>全站曲库</b>，任何歌手的歌都能搜到、都能播。</div><div class="chips">';
    for (var i = 0; i < HOT.length; i++) h += '<span class="chip" data-k="' + esc(HOT[i]) + '">' + esc(HOT[i]) + '</span>';
    return h + '</div>';
  }

  function renderCount() {
    if (!S.kw) { $('count').textContent = '--'; return; }
    $('count').textContent = S.total ? ('共 ' + S.total + ' 首 · 已载入 ' + S.list.length) : ('已载入 ' + S.list.length);
  }

  function render() {
    renderCount();
    $('clearQ').classList.toggle('show', !!$('q').value);
    var box = $('list');

    if (!S.kw) { box.innerHTML = heroHtml(); bindChips(); box.scrollTop = 0; return; }

    if (!S.list.length) {
      if (S.loading) { box.innerHTML = '<div class="loading">正在搜索「' + esc(S.kw) + '」…</div>'; return; }
      if (S.err) {
        box.innerHTML = '<div class="error-box">搜索失败：' + esc(S.err) + '<br><span class="retry" id="retrySearch">重试</span></div>';
        var rb = $('retrySearch');
        if (rb) rb.onclick = function () { doSearch(S.kw, false, true); };
        return;
      }
      box.innerHTML = '<div class="empty-tip">没有找到「' + esc(S.kw) + '」相关的歌曲</div>';
      return;
    }

    var h = '<ul class="playlist">';
    for (var i = 0; i < S.list.length; i++) {
      var s = S.list[i];
      var cls = (S.curSong && ridOf(S.curSong) === ridOf(s)) ? ' class="active"' : '';
      var sub = s.artist + (s.album ? ' · ' + s.album : '');
      h += '<li data-i="' + i + '"' + cls + '>' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="meta"><div class="tname">' + esc(s.name) + '</div>' +
        '<div class="tsub">' + esc(sub) + '</div></div>' +
        '<span class="dur">' + fmtTime(s.duration) + '</span></li>';
    }
    h += '</ul>';
    if (!S.done) {
      h += '<div class="more-wrap"><button class="more" id="moreBtn"' + (S.loading ? ' disabled' : '') + '>' +
        (S.loading ? '加载中…' : '加载更多') + '</button>' +
        '<span class="more-tip">已显示 ' + S.list.length + ' / ' + S.total + ' 首</span></div>';
    }
    box.innerHTML = h;

    var rows = box.querySelectorAll('.playlist li');
    for (var k = 0; k < rows.length; k++) {
      rows[k].onclick = function () { play(+this.getAttribute('data-i')); };
    }
    var mb = $('moreBtn');
    if (mb) mb.onclick = function () { if (!S.loading && !S.done) doSearch(S.kw, true); };
  }

  function bindChips() {
    var chips = $('list').querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].onclick = function () {
        var k = this.getAttribute('data-k');
        $('q').value = k;
        doSearch(k, false);
      };
    }
  }

  /* ================= 流程 ================= */
  function doSearch(kw, append, skipCache) {
    kw = String(kw || '').trim();
    if (!kw) { S.kw = ''; S.list = []; S.total = 0; S.done = true; S.err = ''; S.loading = false; render(); return; }
    if (S.loading) return;

    var my = ++S.seq;
    var pn = append ? S.pn + 1 : 0;
    if (!append) {
      S.kw = kw; S.list = []; S.total = 0; S.done = false; S.pn = 0; S.err = '';
      localStorage.setItem(LAST_KEY, kw);
      if (!skipCache) {
        var c = cacheGet('search_' + kw);
        if (c && c.list && c.list.length) {
          S.list = c.list; S.total = c.total || c.list.length; S.done = true; S.loading = false;
          render();
          return;
        }
      }
    }
    S.loading = true;
    render();
    fetchPage(kw, pn, my, append, 0);
  }

  function dedupeKey(s) { return s.name + '|' + s.artist; }

  function fetchPage(kw, pn, my, append, tries) {
    searchPage(kw, pn).then(function (res) {
      if (my !== S.seq) return;
      var arr = res.list;
      if (append) {
        var seen = {};
        S.list.forEach(function (s) { seen[dedupeKey(s)] = 1; });
        arr = arr.filter(function (s) { return !seen[dedupeKey(s)]; });
        S.list = S.list.concat(arr);
      } else {
        S.list = arr;
      }
      S.total = res.total || S.list.length;
      S.pn = pn;
      S.loading = false;
      S.done = !res.list.length || S.list.length >= S.total;
      if (!append) cacheSet('search_' + kw, { list: S.list, total: S.total });
      render();
    }).catch(function (e) {
      if (my !== S.seq) return;
      if (tries < 1) { setTimeout(function () { fetchPage(kw, pn, my, append, tries + 1); }, 800); return; }
      S.loading = false;
      S.err = (e && e.message) || '搜索失败';
      render();
    });
  }

  /* ================= 播放 ================= */
  function buildSrcUrl(key, song, lv) {
    return SRC[key] + '?id=' + ridOf(song) + '&level=' + lv;
  }

  function parseSrc(txt) {
    var j = parseLoose(txt);
    if (!j) return '';
    if (j.data && j.data.url) return j.data.url;
    if (j.url) return j.url;
    return '';
  }

  function resolveUrl(song, lv) {
    var key = ridOf(song) + '|' + lv;
    var hit = S.urlCache[key];
    if (hit && Date.now() - hit.t < URL_TTL) return Promise.resolve(hit.url);
    var order = ['a', 'b'];
    function attempt(i) {
      if (i >= order.length) return Promise.reject(new Error('音源不可用'));
      return fetch(buildSrcUrl(order[i], song, lv)).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (t) {
        var url = parseSrc(t);
        if (!url) throw new Error('empty');
        S.urlCache[key] = { url: url, t: Date.now() };
        return url;
      }).catch(function () { return attempt(i + 1); });
    }
    return attempt(0);
  }

  var ICON_PLAY = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.6 4.6v14.8L18.9 12z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 4.6h3.4v14.8H7zm6.6 0H17v14.8h-3.4z"/></svg>';
  function setPlaying(p) { $('btnPlay').innerHTML = p ? ICON_PAUSE : ICON_PLAY; }

  function markActive() {
    var rows = $('list').querySelectorAll('.playlist li');
    for (var i = 0; i < rows.length; i++) {
      var s = S.list[+rows[i].getAttribute('data-i')];
      if (S.curSong && s && ridOf(s) === ridOf(S.curSong)) rows[i].classList.add('active');
      else rows[i].classList.remove('active');
    }
  }

  function playAt(i) {
    if (i < 0 || i >= S.playQueue.length) return;
    var song = S.playQueue[i];
    S.playIdx = i;
    S.curSong = song;
    var lv = pickLevel(song, S.quality);
    var token = ++S.playToken;
    markActive();
    $('nowName').textContent = song.name || '未知歌曲';
    $('nowAlbum').textContent = [song.artist, song.album].filter(Boolean).join(' · ');
    $('nowTag').textContent = labelOf(lv);
    setPlaying(false);
    resolveUrl(song, lv).then(function (url) {
      if (token !== S.playToken) return null;
      audio.src = url;
      return audio.play();
    }).then(function () {
      if (token === S.playToken) setPlaying(true);
    }).catch(function () {
      if (token === S.playToken) { setPlaying(false); $('nowAlbum').textContent = '音源解析失败，试试下一首'; }
    });
  }

  function play(i) {
    S.playQueue = S.list.slice();
    playAt(i);
  }

  function step(delta) {
    if (!S.playQueue.length) return;
    var n = S.playQueue.length;
    var i = S.playIdx < 0 ? 0 : (S.playIdx + delta + n) % n;
    playAt(i);
  }

  /* ================= 事件 ================= */
  var timer = null;
  $('q').addEventListener('input', function () {
    clearTimeout(timer);
    var v = this.value;
    timer = setTimeout(function () { doSearch(v, false); }, 420);
  });

  $('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(timer); doSearch(this.value, false, true); }
  });

  $('clearQ').onclick = function () {
    $('q').value = '';
    localStorage.removeItem(LAST_KEY);
    doSearch('', false);
    $('q').focus();
  };

  $('list').addEventListener('scroll', function () {
    if (S.loading || S.done || !S.kw) return;
    if (this.scrollTop + this.clientHeight >= this.scrollHeight - 90) doSearch(S.kw, true);
  });

  $('btnPlay').onclick = function () {
    if (!S.curSong) {
      if (S.list.length) play(0);
      return;
    }
    if (audio.paused) {
      if (!audio.src) playAt(S.playIdx < 0 ? 0 : S.playIdx);
      else audio.play();
    } else {
      audio.pause();
    }
  };
  $('btnPrev').onclick = function () { step(-1); };
  $('btnNext').onclick = function () { step(1); };

  $('bar').onclick = function (e) {
    if (!audio.duration) return;
    var r = this.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    audio.currentTime = p * audio.duration;
  };

  $('vol').oninput = function () { audio.volume = this.value / 100; };
  audio.volume = 0.8;

  audio.addEventListener('timeupdate', function () {
    var d = audio.duration || 0;
    $('tCur').textContent = fmtTime(audio.currentTime);
    $('tDur').textContent = fmtTime(d);
    $('barFill').style.width = d ? (audio.currentTime / d * 100) + '%' : '0%';
  });
  audio.addEventListener('ended', function () { step(1); });
  audio.addEventListener('pause', function () { setPlaying(false); });
  audio.addEventListener('play', function () { setPlaying(true); });

  $('nowTag').onclick = function () {
    var idx = 1;
    for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].key === S.quality) idx = i; }
    S.quality = LEVELS[(idx + 1) % LEVELS.length].key;
    localStorage.setItem('jay_quality', S.quality);
    if (S.curSong) playAt(S.playIdx < 0 ? 0 : S.playIdx);
    else $('nowTag').textContent = labelOf(S.quality);
  };

  /* ================= 启动 ================= */
  setPlaying(false);
  $('nowTag').textContent = labelOf(S.quality);
  render();
  (function () {
    var last = '';
    try { last = localStorage.getItem(LAST_KEY) || ''; } catch (e) {}
    if (last) { $('q').value = last; doSearch(last, false); }
  })();
})();
</script>
</body>
</html>
